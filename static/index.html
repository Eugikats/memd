/* ----- trends ----- */
async function renderTrends() {
  const d = await api('/api/trends');
  if (S.view !== 'trends') return;
  const k = d.kpi, n = k.length;
  const byWeek = {}; d.weekly.forEach(r => { const w = byWeek[r.week] || (byWeek[r.week] = { c: 0, o: 0, s: 0, r: 0 }); w.c += r.consumed_value; w.o += r.output_value; w.s += r.sold_value; w.r += r.received_value; });
  const weeks = Object.keys(byWeek).sort();
  const cls = c => weeks.map(w => (d.weekly.find(r => r.week === w && r.item_class === c) || {}).consumed_value || 0);
  const lab = k.map(x => x.extracted_at.replace('T', ' ').slice(0, 16));
  const lastWeek = weeks.length ? weeks[weeks.length - 1] : '';
  const latest = lastWeek ? byWeek[lastWeek] : { c: 0, o: 0, s: 0, r: 0 };
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const weekNote = lastWeek ? `Week of ${months[+lastWeek.slice(5, 7) - 1]} ${+lastWeek.slice(8)}` : 'No weekly movement';
  const faces = {
    'Consumption': { icon: 'trend', bg: '#e8f1ff', fg: '#2563EB' },
    'Output': { icon: 'factory', bg: '#e8f8ef', fg: '#16a34a' },
    'Sales': { icon: 'truck', bg: '#f3eefe', fg: '#7c5cf0' },
    'Receipts': { icon: 'package', bg: '#fff4e8', fg: '#e07a12' },
  };
  const cards = [
    { label: 'Consumption', value: moneyRich(latest.c), spark: weeks.map(w => byWeek[w].c) },
    { label: 'Output', value: moneyRich(latest.o), spark: weeks.map(w => byWeek[w].o) },
    { label: 'Sales', value: moneyRich(latest.s), spark: weeks.map(w => byWeek[w].s) },
    { label: 'Receipts', value: moneyRich(latest.r), spark: weeks.map(w => byWeek[w].r) },
  ];
  const kpis = cards.map(c => {
    const face = faces[c.label];
    return `<article class="inv-kpi"><div class="inv-kpi-top"><span class="inv-kpi-ic" style="color:${face.fg}">${kpiMark(face.icon)}</span><p class="inv-kpi-l">${esc(c.label)}</p></div>
      <div class="inv-kpi-row"><p class="inv-kpi-v">${c.value}</p>${cipSpark(c.spark, face.fg, c.label)}</div><p class="inv-kpi-note">${esc(weekNote)}</p></article>`;
  }).join('');
  const loadNote = n < 3 ? `${n} load${n === 1 ? '' : 's'} so far — this line builds up with every scheduled refresh during the proof period.` : 'On-hand value at each Business Central load';
  const card = (title, sub, id) => `<section class="card inv-card"><div class="inv-ch-head"><div><h3>${title}</h3><p>${sub}</p></div></div><div class="chartbox" style="height:280px"><canvas id="${id}"></canvas></div></section>`;
  document.getElementById('content').innerHTML = `<div class="inv-page">
    <div class="inv-head">${sectionTabs('trends')}<div class="inv-actions"><button class="btn" id="askThis">${svg('sparkle', 14)} Ask about this view</button></div></div>
    <div class="inv-kpis cols-4">${kpis}</div>
    <div class="inv-charts2">
      ${card('Weekly flow at cost (UGX)', 'Consumption, output, sales and purchase receipts', 't1')}
      ${card('Weekly consumption by class (UGX)', 'Raw material, WIP and finished goods', 't2')}
      ${card('Stock value by class per data load', esc(loadNote), 't3')}
      ${card('Risk measures per data load', 'Out of stock, short cover, overdue lines and constrained products', 't4')}
    </div></div>`;
  document.getElementById('askThis').onclick = () => { askOnPage('How are weekly consumption, output, sales and receipts moving, and what changed in stock and risk at the last data load?'); };
  S.charts.forEach(ch => ch.destroy()); S.charts = [];
  const ser = (name, key, data) => ({ name, key, data });
  const glass = { quiet: true, glassy: true };
  const classGlass = Object.assign({ palette: INV_PALETTE }, glass);
  S.charts.push(drawChart(t1, Object.assign({ type: 'line', unit: 'UGX', labels: weeks, series: [ser('Consumption', 'seq', weeks.map(w => byWeek[w].c)), ser('Output', 'good', weeks.map(w => byWeek[w].o)), ser('Sales (cost)', 'FG', weeks.map(w => byWeek[w].s)), ser('Purchase receipts', 'serious', weeks.map(w => byWeek[w].r))] }, glass)));
  S.charts.push(drawChart(t2, Object.assign({ type: 'bar', unit: 'UGX', stacked: true, labels: weeks, series: [ser('Raw Material', 'RM', cls('RM')), ser('Work in Progress', 'WIP', cls('WIP')), ser('Finished Goods', 'FG', cls('FG'))] }, classGlass)));
  S.charts.push(drawChart(t3, Object.assign({ type: n > 1 ? 'line' : 'bar', unit: 'UGX', labels: lab, series: [ser('Raw Material', 'RM', k.map(x => x.rm_value)), ser('Work in Progress', 'WIP', k.map(x => x.wip_value)), ser('Finished Goods', 'FG', k.map(x => x.fg_value))] }, classGlass)));
  S.charts.push(drawChart(t4, { type: n > 1 ? 'line' : 'bar', unit: 'items', quiet: true, glassy: true, labels: lab, series: [ser('Out of stock', 'crit', k.map(x => x.out_of_stock)), ser('Run out ≤7 days', 'serious', k.map(x => x.run_out_7d)), ser('Overdue PO lines', 'warning', k.map(x => x.overdue_lines)), ser('Constrained products', 'seq', k.map(x => x.constrained))] }));
}

/* ----- data refresh ----- */
async function renderDataRefresh() {
  const [s, log] = await Promise.all([api('/api/schedules'), api('/api/refresh/log')]);
  if (S.view !== 'datarefresh') return;
  S.meta = await api('/api/meta');
  if (S.view !== 'datarefresh') return;
  const n = S.meta.notes, r = n.reconciliation, rf = s.refresh, last = log[0];
  const loadedAt = new Date(n.extracted_at);
  const loadedLabel = Number.isNaN(loadedAt.getTime()) ? String(n.extracted_at || '').replace('T', ' ').slice(0, 16) : loadedAt.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const runLabel = !last ? 'Initial' : last.status === 'ok' ? 'OK' : 'Failed';
  const match = r && r.items_compared ? 100 * r.items_matching / r.items_compared : null;
  const entries = (n.open_ledger_entries || 0) + (n.movement_entries || 0);
  const hist = log.slice().reverse();
  const faces = {
    'Loaded': { icon: 'clock', bg: '#e8f1ff', fg: '#2563EB' },
    'Last run': { icon: last && last.status === 'failed' ? 'alert' : 'check', bg: last && last.status === 'failed' ? '#fdecec' : '#e8f8ef', fg: last && last.status === 'failed' ? '#d03b3b' : '#16a34a' },
    'Match to BC': { icon: 'shield', bg: '#eef2ff', fg: '#4f46e5' },
    'Records': { icon: 'doc', bg: '#e8f1ff', fg: '#2563EB' },
  };
  const cards = [
    { label: 'Loaded', value: esc(loadedLabel), spark: null },
    { label: 'Last run', value: `${esc(runLabel)}${last ? `<small> ${esc(last.trigger || 'manual')}</small>` : ''}`, spark: null, note: last ? (last.started || '').replace('T', ' ').slice(0, 16) : '' },
    { label: 'Match to BC', value: match == null ? '–' : `${match.toFixed(1)}<small> %</small>`, spark: hist.map(x => x.recon_pct).filter(x => x != null), note: r ? `${r.items_matching.toLocaleString()} of ${r.items_compared.toLocaleString()} items` : '' },
    { label: 'Records', value: `${entries.toLocaleString()}<small> entries</small>`, spark: hist.map(x => x.records).filter(x => x != null), note: `open + ${n.window_days}-day movements` },
  ];
  const kpis = cards.map(k => {
    const face = faces[k.label];
    return `<article class="inv-kpi"><div class="inv-kpi-top"><span class="inv-kpi-ic" style="color:${face.fg}">${kpiMark(face.icon)}</span><p class="inv-kpi-l">${esc(k.label)}</p></div>
      <div class="inv-kpi-row"><p class="inv-kpi-v">${k.value}</p>${cipSpark(k.spark, face.fg, k.label)}</div>${k.note ? `<p class="inv-kpi-note">${esc(k.note)}</p>` : ''}</article>`;
  }).join('');
  const logTable = { title: 'Refresh run log', total_rows: log.length, drill: null,
    columns: [{ field: 'started', label: 'Started (EAT)', kind: 'text' }, { field: 'trigger', label: 'Trigger', kind: 'text' }, { field: 'user', label: 'By', kind: 'text' }, { field: 'status', label: 'Status', kind: 'status' },
      { field: 'seconds', label: 'Seconds', kind: 'qty' }, { field: 'records', label: 'Records', kind: 'qty' }, { field: 'recon_pct', label: 'Reconciliation %', kind: 'days' }, { field: 'detail', label: 'Detail', kind: 'text' }],
    rows: log.map(x => ({ ...x, started: (x.started || '').replace('T', ' ').slice(0, 19), status: x.status === 'ok' ? 'Healthy' : 'Failed', detail: x.error || (x.alerts_triggered && x.alerts_triggered.length ? 'Alerts: ' + x.alerts_triggered.join('; ') : '') })) };
  document.getElementById('content').innerHTML = `<div class="inv-page">
    <div class="inv-head">${sectionTabs('datarefresh')}<div class="inv-actions"><button class="btn" id="askThis">${svg('sparkle', 14)} Ask about this view</button>
      <button class="btn" id="pdfThis">${svg('printer', 14)} Print</button>
      <button class="btn primary" id="rnow">${svg('refresh', 14)} ${S.meta.refreshing ? 'Refreshing…' : 'Refresh now'}</button></div></div>
    ${S.meta.last_error ? `<div class="banner" style="border-left-color:var(--critical);margin-top:14px">Last refresh failed: ${esc(S.meta.last_error)}</div>` : ''}
    <div class="inv-kpis cols-4">${kpis}</div>
    <div class="inv-topcharts">
      <section class="card inv-card"><div class="inv-ch-head"><div><h3>Scheduled refresh</h3><p>Last scheduled run: ${esc((rf.last_run || '–').replace('T', ' ').slice(0, 16))}. Alerts are re-checked after each load.</p></div></div>
        <div class="inv-pad"><label class="chk"><input type="checkbox" id="rf_en" ${rf.enabled ? 'checked' : ''}> Refresh automatically</label>
          <div class="inv-days"><input type="time" id="rf_time" value="${esc(rf.time)}"> <span class="muted">EAT on</span>
            ${DAYS.map((d, i) => `<label class="chk"><input type="checkbox" class="rf_d" value="${i}" ${rf.days.includes(i) ? 'checked' : ''}> ${d}</label>`).join('')}</div>
          <button class="btn primary" id="rf_save">Save schedule</button> <span id="rf_msg" class="muted"></span></div></section>
      <section class="card inv-card"><div class="inv-ch-head"><div><h3>Connection</h3><p>Read-only Business Central</p></div></div>
        <div class="inv-pad"><dl><dt>Source</dt><dd>${esc(n.company)} · ${esc(n.environment)}</dd><dt>Access</dt><dd>Read-only (Entra ID app, client credentials). Manufacturing Intelligence Platform never posts, edits or deletes Business Central records.</dd>
          <dt>Tables</dt><dd>Item Ledger Entries, Purchase Lines, Items, Locations, Vendors, Production BOM header &amp; lines</dd></dl></div></section>
    </div>
    <div class="card tablecard inv-table" id="rlog"></div></div>`;
  document.getElementById('askThis').onclick = () => { askOnPage('Summarise the data refresh: when did Business Central last load, did it reconcile, and is the schedule healthy?'); };
  document.getElementById('pdfThis').onclick = () => window.print();
  document.getElementById('rnow').onclick = async () => {
    await api('/api/refresh', { method: 'POST' });
    rnow.textContent = 'Refreshing… (about 2 minutes)';
    const t = setInterval(async () => { const m = await api('/api/meta'); if (!m.refreshing) { clearInterval(t); S.meta = m; renderWhen(); if (S.view === 'datarefresh') renderDataRefresh(); } }, 5000);
  };
  document.getElementById('rf_save').onclick = async () => {
    await api('/api/schedules/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: rf_en.checked, time: rf_time.value, days: [...document.querySelectorAll('.rf_d:checked')].map(x => +x.value) }) });
    rf_msg.textContent = 'Saved.';
  };
  renderTable(document.getElementById('rlog'), logTable, { variant: 'inventory', size: 15, search: 'Search trigger, user, detail…' });
}

/* ----- audit ----- */
async function renderAudit() {
  const rows = await api('/api/audit');
  if (S.view !== 'audit') return;
  const types = [...new Set(rows.map(r => r.type).filter(Boolean))].sort();
  const count = pred => rows.filter(pred).length;
  const questions = count(r => r.type === 'azure' || r.type === 'claude' || r.type === 'offline');
  const agents = count(r => r.type === 'agent');
  const decisions = count(r => r.type === 'decision');
  const reports = count(r => r.type === 'report');
  const refreshes = count(r => r.type === 'refresh');
  const total = rows.length;
  const share = n => total ? Math.round(100 * n / total) : 0;
  const faces = {
    'Events': { icon: 'book', bg: '#eef2ff', fg: '#4f46e5' },
    'Questions': { icon: 'sparkle', bg: '#e8f1ff', fg: '#2563EB' },
    'Agent runs': { icon: 'play', bg: '#f3eefe', fg: '#7c5cf0' },
    'Decisions': { icon: 'check', bg: '#e8f8ef', fg: '#16a34a' },
    'Reports': { icon: 'doc', bg: '#e8f1ff', fg: '#2563EB' },
    'Refreshes': { icon: 'refresh', bg: '#fff4e8', fg: '#e07a12' },
  };
  const cards = [
    { label: 'Events', n: total },
    { label: 'Questions', n: questions, pct: share(questions) },
    { label: 'Agent runs', n: agents, pct: share(agents) },
    { label: 'Decisions', n: decisions, pct: share(decisions) },
    { label: 'Reports', n: reports, pct: share(reports) },
    { label: 'Refreshes', n: refreshes, pct: share(refreshes) },
  ];
  const kpis = cards.map(k => {
    const face = faces[k.label];
    return `<article class="inv-kpi"><div class="inv-kpi-top"><span class="inv-kpi-ic" style="color:${face.fg}">${kpiMark(face.icon)}</span><p class="inv-kpi-l">${esc(k.label)}</p>${invRing(k.pct, face.fg)}</div>
      <div class="inv-kpi-row"><p class="inv-kpi-v">${esc(String(fmt(k.n, 'qty')))}<small> events</small></p>${cipSpark(null, face.fg, k.label)}</div></article>`;
  }).join('');
  const typeLabel = t => { const s = String(t || ''); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; };
  const shown = () => {
    const t = document.getElementById('a_t').value;
    return rows.filter(r => !t || r.type === t).map(r => ({ ...r, at: String(r.at || '').replace('T', ' ').slice(0, 19) }));
  };
  const tableOf = list => ({ title: 'Events', total_rows: list.length, drill: null,
    columns: [{ field: 'at', label: 'When', kind: 'text' }, { field: 'user', label: 'User', kind: 'text' }, { field: 'type', label: 'Type', kind: 'text' }, { field: 'event', label: 'Event', kind: 'text' }, { field: 'detail', label: 'Detail', kind: 'text' }],
    rows: list });
  document.getElementById('content').innerHTML = `<div class="inv-page">
    <div class="inv-head">${sectionTabs('audit')}<div class="inv-actions"><button class="btn" id="askThis">${svg('sparkle', 14)} Ask about this view</button>
      <button class="btn" id="pdfThis">${svg('printer', 14)} Print</button>
      <button class="btn primary" id="exportInv">${svg('download', 14)} Export</button></div></div>
    <div class="inv-kpis cols-6">${kpis}</div>
    <div class="filters inv-filters"><select id="a_t"><option value="">All events</option>${types.map(t => `<option value="${esc(t)}">${esc(typeLabel(t))}</option>`).join('')}</select>
      <button class="btn ghost" id="a_clear">Clear</button></div>
    <div class="card tablecard inv-table" id="alog"></div></div>`;
  const draw = () => {
    const spec = tableOf(shown());
    renderTable(document.getElementById('alog'), spec, { variant: 'inventory', size: 30, search: 'Search user, event, detail…' });
    document.getElementById('exportInv').onclick = () => exportCsv(spec);
  };
  document.getElementById('askThis').onclick = () => { askOnPage('Summarise the audit log: who did what, and which questions, decisions, reports and refreshes need attention?'); };
  document.getElementById('pdfThis').onclick = () => window.print();
  document.getElementById('a_t').onchange = draw;
  document.getElementById('a_clear').onclick = () => { document.getElementById('a_t').value = ''; draw(); };
  draw();
}

  renderer.domElement.onpointerdown=e=>{drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(!drag)return;theta-=(e.clientX-drag[0])*.008;phi+=(e.clientY-drag[1])*.006;drag=[e.clientX,e.clientY];updateCamera()};renderer.domElement.onpointerup=()=>drag=null;renderer.domElement.onwheel=e=>{radius=Math.max(17,Math.min(55,radius+e.deltaY*.025));updateCamera();e.preventDefault()};
  const resize=new ResizeObserver(()=>{if(!host.isConnected)return;camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)});resize.observe(host);twinDispose=()=>{resize.disconnect();renderer.dispose();scene.traverse(o=>{o.geometry?.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{m.map?.dispose();m.dispose()})}})};
  const animate=()=>{if(!host.isConnected){twinDispose?.();return}renderer.render(scene,camera);twinFrame=requestAnimationFrame(animate)};animate()
 }catch(e){host.insertAdjacentHTML('beforeend',`<div style="position:absolute;inset:45px 12px 25px;display:grid;place-items:center;color:#53647d;text-align:center"><div>WebGL 3D is unavailable in this browser. The pipeline twin requires WebGL and a connection to the Three.js library.<br><small>${sectorEsc(e.message)}</small></div></div>`)}
}
function memdStore(key, fallback){try{return JSON.parse(localStorage.getItem('memd-'+key)) ?? fallback}catch{return fallback}}
function renderMemdProfile(){
 const p=memdStore('profile',{name:'',title:'',department:'',timezone:'Africa/Kampala'});
 document.getElementById('content').innerHTML=`<div class="memd-page"><div class="memd-hero"><span class="memd-badge">Workspace</span><h1>Your <span>profile</span></h1><p>Set how your name and role appear in this browser.</p></div><section class="memd-card"><h2>Profile details</h2><div class="memd-grid"><label>Display name<input class="memd-field" id="profileName" value="${sectorEsc(p.name)}"></label><label>Role or title<input class="memd-field" id="profileTitle" value="${sectorEsc(p.title)}"></label><label>Department<input class="memd-field" id="profileDepartment" value="${sectorEsc(p.department)}"></label><label>Timezone<select class="memd-field" id="profileTimezone"><option>Africa/Kampala</option><option>Africa/Nairobi</option><option>UTC</option></select></label></div><p><button class="memd-button" id="saveProfile">Save profile</button> <span id="profileSaved" hidden>Saved on this device.</span></p></section></div>`;
 document.getElementById('profileTimezone').value=p.timezone||'Africa/Kampala';document.getElementById('saveProfile').onclick=()=>{const next={name:document.getElementById('profileName').value.trim(),title:document.getElementById('profileTitle').value.trim(),department:document.getElementById('profileDepartment').value.trim(),timezone:document.getElementById('profileTimezone').value};localStorage.setItem('memd-profile',JSON.stringify(next));const foot=document.querySelector('.rail-user .user-copy');if(foot)foot.innerHTML=`<b>${sectorEsc(next.name||'MEMD workspace')}</b><small>${sectorEsc(next.title||'Sector intelligence')}</small>`;document.getElementById('profileSaved').hidden=false}

function renderMemdSettings(){const p=memdStore('preferences',{refreshSeconds:60,compact:false});document.getElementById('content').innerHTML=`<div class="memd-page"><div class="memd-hero"><span class="memd-badge">Workspace controls</span><h1>Platform <span>settings</span></h1><p>Manage this browser's display and workspace preferences.</p></div><section class="memd-card"><h2>Preferences</h2><label><input id="compactMode" type="checkbox" ${p.compact?'checked':''}> Compact data tables</label><p><label>Default reporting period <select class="memd-field" id="defaultPeriod"><option>2026 Q1</option><option>2025 Q4</option><option>2024/25</option></select></label></p><button class="memd-button" id="saveSettings">Save settings</button> <span id="settingsSaved" hidden>Saved on this device.</span></section><section class="memd-card" style="margin-top:16px"><h2>Data and connections</h2><p>Manage sector datasets and review connected workspace services.</p><button class="memd-button" id="settingsCatalogue">Open data catalogue</button></section></div>`;document.getElementById('defaultPeriod').value=p.defaultPeriod||'2026 Q1';document.getElementById('saveSettings').onclick=()=>{localStorage.setItem('memd-preferences',JSON.stringify({compact:document.getElementById('compactMode').checked,defaultPeriod:document.getElementById('defaultPeriod').value,refreshSeconds:60}));document.getElementById('settingsSaved').hidden=false};document.getElementById('settingsCatalogue').onclick=()=>go('catalogue')}
function renderMemdAgents(){const rules=memdStore('agent-rules',[{id:'stock-cover',name:'Low petroleum stock cover',metric:'Strategic stock cover',sector:'petroleum',op:'<',threshold:20,active:true},{id:'project-delay',name:'Project schedule below 70%',metric:'Strategic projects on schedule',sector:'projects',op:'<',threshold:70,active:true}]);document.getElementById('content').innerHTML=`<div class="memd-page"><div class="memd-hero"><span class="memd-badge">Advisory rules</span><h1>Agent <span>rules</span></h1><p>Manage local indicator checks. Results are prompts for review, not automated Ministry decisions.</p></div><div class="memd-card"><h2>Configured checks</h2><div id="agentRulesList">${rules.map((r,i)=>`<div class="memd-log"><i class="${r.active?'alert':''}"></i><span><b>${sectorEsc(r.name)}</b> · ${sectorEsc(r.metric)} ${sectorEsc(r.op)} ${Number(r.threshold)} <button class="btn" data-toggle-rule="${i}">${r.active?'Pause':'Enable'}</button> <button class="btn" data-delete-rule="${i}">Remove</button></span></div>`).join('')||'<p>No configured checks.</p>'}</div><div class="memd-grid"><label>Rule name<input id="ruleName" class="memd-field" placeholder="New indicator check"></label><label>Indicator<select id="ruleMetric" class="memd-field"><option value="petroleum|Strategic stock cover">Petroleum stock cover (days)</option><option value="projects|Strategic projects on schedule">Projects on schedule (%)</option><option value="energy|Distribution losses">Distribution losses (%)</option><option value="minerals|Inspections completed">Inspections completed (%)</option></select></label><label>Alert when value is<select id="ruleOp" class="memd-field"><option value="<">Below</option><option value=">">Above</option></select></label><label>Threshold<input id="ruleThreshold" class="memd-field" type="number" value="20"></label></div><p><button class="memd-button" id="addRule">Add rule</button> <button class="memd-button" id="runRules">Run checks against latest stored values</button></p><div id="ruleResults"></div></div></div>`;
 const save=()=>localStorage.setItem('memd-agent-rules',JSON.stringify(rules));document.querySelectorAll('[data-toggle-rule]').forEach(b=>b.onclick=()=>{rules[+b.dataset.toggleRule].active=!rules[+b.dataset.toggleRule].active;save();renderMemdAgents()});document.querySelectorAll('[data-delete-rule]').forEach(b=>b.onclick=()=>{rules.splice(+b.dataset.deleteRule,1);save();renderMemdAgents()});document.getElementById('addRule').onclick=()=>{const [sector,metric]=document.getElementById('ruleMetric').value.split('|');const name=document.getElementById('ruleName').value.trim()||metric;rules.push({id:crypto.randomUUID(),name,sector,metric,op:document.getElementById('ruleOp').value,threshold:Number(document.getElementById('ruleThreshold').value),active:true});save();renderMemdAgents()};document.getElementById('runRules').onclick=async()=>{const d=await sectorData();const matches=rules.filter(r=>r.active).map(r=>{const v=d.series[r.sector]?.[r.metric]?.at(-1);return v&&((r.op==='<'?v.value<r.threshold:v.value>r.threshold))?`${r.name}: ${v.value} ${v.unit} (${v.period}) meets configured threshold; refer for human review.`:null}).filter(Boolean);document.getElementById('ruleResults').innerHTML=`<div class="memd-source"><b>Check complete.</b> ${matches.length?matches.map(sectorEsc).join('<br>'):'No active rules triggered on the latest stored values.'} Results use workspace records and are advisory.</div>`}}
function renderMemdReports(){
 document.getElementById('content').innerHTML=`<div class="memd-page"><div class="memd-hero"><span class="memd-badge">Report builder</span><h1>Reports & <span>reproduction</span></h1><p>Generate a workbook from database-backed sector records, or upload an Excel report to preserve its layout and inspect its formulas and formatting.</p></div><div class="memd-grid"><section class="memd-card"><h2>Reproduce an uploaded report</h2><p>Upload a workbook. The report agent inspects sheet structure, formulas, labels, and cell styles, then returns a copy with current MEMD database records.</p><form id="memdReportForm" class="memd-upload"><input id="memdReportFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" required><p><button class="memd-button" id="memdReportSubmit">Inspect & generate report</button></p><div class="memd-note">Workbooks are stored with the workspace and processed in the background. Larger files may take longer.</div></form><div id="memdReportResult" aria-live="polite"></div></section><section class="memd-card"><h2>Available period measures</h2><div id="memdReportPreview">Loading database…</div></section></div><div class="memd-section-title">Recent generated workbooks</div><div class="memd-card" id="memdReportHelp"><p>Uploaded templates are recorded in the workspace. Each generated workbook includes sector, indicator, period, value, unit, and data classification.</p></div></div>`;
 sectorData().then(d=>{if(S.view!=='reports')return;document.getElementById('memdReportPreview').innerHTML=`<p>${d.indicators.length} indicator-period values across minerals, petroleum, energy, and projects.</p><button class="memd-button" id="memdDownloadBase">Download current sector data (.csv)</button>`;document.getElementById('memdDownloadBase').onclick=()=>{const rows=[['Sector','Indicator','Period','Value','Unit','Classification'],...d.indicators.map(x=>[x.sector,x.metric,x.period,x.value,x.unit,'MEMD workspace'])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='memd_sector_indicators.csv';a.click();URL.revokeObjectURL(a.href)}});api('/api/memd/reports/templates').then(rows=>{if(S.view!=='reports')return;document.getElementById('memdReportHelp').innerHTML=rows.length?`<table class="memd-table"><thead><tr><th>Source workbook</th><th>Uploaded</th><th>Formulas</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${sectorEsc(x.filename)}</td><td>${sectorEsc(x.uploaded_at)}</td><td>${x.formula_count}</td><td><a class="memd-button" href="/api/memd/reports/${encodeURIComponent(x.id)}/download">Download workbook</a></td></tr>`).join('')}</tbody></table>`:'<p>No workbooks have been generated yet. Uploaded files and outputs are saved locally for retrieval.</p>'}).catch(()=>{});
 document.getElementById('memdReportForm').onsubmit=async e=>{e.preventDefault();const out=document.getElementById('memdReportResult'),submit=document.getElementById('memdReportSubmit'),file=document.getElementById('memdReportFile').files[0];if(!file)return;submit.disabled=true;out.textContent='Uploading workbook…';const fd=new FormData();fd.append('file',file);try{const r=await fetch('/api/memd/reports/jobs',{method:'POST',body:fd});const job=await r.json();if(!r.ok)throw new Error(job.error||'Workbook upload failed');out.textContent='Workbook received. Inspecting formulas and generating a database-backed report…';let d=null;for(let attempt=0;attempt<1800;attempt++){await new Promise(resolve=>setTimeout(resolve,1500));const statusResponse=await fetch(job.status_url);const state=await statusResponse.json();if(!statusResponse.ok)throw new Error(state.error||'Could not read report status');if(state.status==='ready'){d=state.result;break}if(state.status==='failed')throw new Error(state.error||'Report generation failed');if(attempt%8===7)out.textContent=state.status==='queued'?'Report is queued and will start shortly…':'The report agent is inspecting the workbook and building the output…'}if(!d)throw new Error('Report generation is taking longer than expected. Your job is still saved; check Reports again shortly.');out.innerHTML=`<div class="memd-result"><b>Workbook ready: ${sectorEsc(d.filename)}</b><br>${d.sheets.length} sheet(s) inspected · ${d.formula_count} formula(s) preserved · ${d.matched_cells.length} indicator label(s) populated${d.sheets.map(x=>`<p><b>${sectorEsc(x.name)}</b> · ${x.rows} rows · ${x.columns} columns · ${x.formulas.length} formulas scanned</p>`).join('')}<ul>${d.notes.map(x=>`<li>${sectorEsc(x)}</li>`).join('')}</ul><a class="memd-button" href="${sectorEsc(d.download_url)}">Download generated workbook</a></div>`;document.getElementById('memdReportFile').value='';const rows=await api('/api/memd/reports/templates');document.getElementById('memdReportHelp').innerHTML=rows.length?`<table class="memd-table"><thead><tr><th>Source workbook</th><th>Uploaded</th><th>Formulas</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${sectorEsc(x.filename)}</td><td>${sectorEsc(x.uploaded_at)}</td><td>${x.formula_count}</td><td><a class="memd-button" href="/api/memd/reports/${encodeURIComponent(x.id)}/download">Download workbook</a></td></tr>`).join('')}</tbody></table>`:'<p>No workbooks have been generated yet.</p>'}catch(err){out.innerHTML=`<div class="memd-result">${sectorEsc(err.message)}</div>`}finally{submit.disabled=false}}
}
function renderMemdCatalogue(){sectorData().then(d=>{document.getElementById('content').innerHTML=`<div class="memd-page"><div class="memd-hero"><span class="memd-badge">SQLite data store</span><h1>Data <span>catalogue</span></h1><p>Persistent sector indicators and asset readings drive the graphs and twin.</p></div><div class="memd-card"><h3>Indicators · ${d.indicators.length} observations</h3><table class="memd-table"><thead><tr><th>Sector</th><th>Measure</th><th>Period</th><th>Value</th><th>Unit</th><th></th></tr></thead><tbody>${d.indicators.map((r,i)=>`<tr><td>${sectorEsc(r.sector)}</td><td>${sectorEsc(r.metric)}</td><td>${sectorEsc(r.period)}</td><td>${r.value}</td><td>${sectorEsc(r.unit)}</td><td><button class="btn" data-edit-ind="${i}">Edit value</button></td></tr>`).join('')}</tbody></table></div><div class="memd-card" style="margin-top:16px"><h3>Asset inventory · ${d.assets.length} assets</h3><table class="memd-table"><thead><tr><th>Asset</th><th>Type</th><th>District</th><th>Status</th><th>Risk</th><th></th></tr></thead><tbody>${d.assets.map(a=>`<tr><td>${sectorEsc(a.name)}</td><td>${sectorEsc(a.type)}</td><td>${sectorEsc(a.district)}</td><td>${sectorEsc(a.status)}</td><td>${sectorEsc(a.risk)}</td><td><button class="btn" data-asset="${sectorEsc(a.id)}">View twin</button></td></tr>`).join('')}</tbody></table></div></div>`;document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>{S.twinAsset=b.dataset.asset;go('twin')});document.querySelectorAll('[data-edit-ind]').forEach(b=>b.onclick=async()=>{const r=d.indicators[+b.dataset.editInd],value=prompt(`Update ${r.metric} (${r.unit}) for ${r.period}`,r.value);if(value===null)return;const resp=await fetch('/api/memd/indicator',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sector:r.sector,metric:r.metric,period:r.period,value})});const out=await resp.json();if(!resp.ok){alert(out.error);return}renderMemdCatalogue()})})}

le.cursor='pointer';topAvatar.title='Open profile';topAvatar.onclick=()=>go('profile',true)}const t=document.getElementById('railToggle');if(t)t.onclick=()=>{const collapsed=rail.classList.toggle('collapsed');document.body.classList.toggle('rail-collapsed',collapsed);document.getElementById('railSlot').classList.toggle('collapsed',collapsed);localStorage.setItem('pulse-rail-collapsed',collapsed?'1':'0')};if(localStorage.getItem('pulse-rail-collapsed')==='1'){rail.classList.add('collapsed');document.body.classList.add('rail-collapsed');document.getElementById('railSlot').classList.add('collapsed')}go('command',true)};
