    box.innerHTML = `<div class="card"><h3>New schedule</h3><div class="filters" style="margin:0"><select id="ns_r">${cat.catalogue.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>
      <select id="ns_c"><option value="">All classes</option><option>RM</option><option>WIP</option><option>FG</option></select>
      <select id="ns_s"><option value="">All sites</option>${S.meta.sites.map(x => `<option>${esc(x)}</option>`).join('')}</select></div><div id="ns_f" style="margin-top:8px"></div></div>`;
    const draw = () => scheduleForm(document.getElementById('ns_f'), ns_r.value, { item_class: ns_c.value, site: ns_s.value });
    ns_r.onchange = draw; ns_c.onchange = draw; ns_s.onchange = draw; draw();
    const orig = document.getElementById('ns_f');
    new MutationObserver(() => { if (orig.textContent.includes('Scheduled —')) setTimeout(renderSchedules, 900); }).observe(orig, { childList: true, subtree: true });
  };
  document.querySelectorAll('[data-tog]').forEach(x => x.onclick = async () => { await api('/api/schedules/report/' + x.dataset.tog, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: x.dataset.en === '1' }) }); renderSchedules(); });
  document.querySelectorAll('[data-del]').forEach(x => x.onclick = async () => { if (confirm('Delete this schedule?')) { await fetch('/api/schedules/report/' + x.dataset.del, { method: 'DELETE' }); renderSchedules(); } });
  renderTable(document.getElementById('hist'), { title: 'Report history', total_rows: h.length, drill: null,
    columns: [{ field: 'generated_at', label: 'Generated (EAT)', kind: 'text' }, { field: 'name', label: 'Report', kind: 'text' }, { field: 'filters', label: 'Filters', kind: 'text' },
      { field: 'by', label: 'By', kind: 'text' }, { field: 'trigger', label: 'Trigger', kind: 'text' }, { field: 'rows', label: 'Rows', kind: 'qty' }, { field: 'dl', label: '', kind: 'link' }],
    rows: h.map(x => ({ ...x, filters: Object.entries(x.params || {}).map(([k, v]) => k + '=' + v).join(', ') || '–', dl: `/api/reports/history/${x.id}/download` })) }, { size: 20 });
}

/* ----- trends ----- */
async function renderTrends() {
  const d = await api('/api/trends');
  const k = d.kpi, n = k.length;
  const byWeek = {}; d.weekly.forEach(r => { const w = byWeek[r.week] || (byWeek[r.week] = { c: 0, o: 0, s: 0, r: 0 }); w.c += r.consumed_value; w.o += r.output_value; w.s += r.sold_value; w.r += r.received_value; });
  const weeks = Object.keys(byWeek).sort();
  const cls = c => weeks.map(w => (d.weekly.find(r => r.week === w && r.item_class === c) || {}).consumed_value || 0);
  const lab = k.map(x => x.extracted_at.replace('T', ' ').slice(0, 16));
  document.getElementById('content').innerHTML = `<div class="vhead"><div><h1>Trends</h1><p>How the supply chain is moving week by week, and how the headline measures change with each data load.</p></div></div>
    <div class="charts"><div class="card"><h3>Weekly flow at cost (UGX)</h3><div class="chartbox"><canvas id="t1"></canvas></div></div>
      <div class="card"><h3>Weekly consumption by class (UGX)</h3><div class="chartbox"><canvas id="t2"></canvas></div></div>
      <div class="card"><h3>Stock value by class per data load</h3><div class="chartbox"><canvas id="t3"></canvas></div>${n < 3 ? `<div class="muted">${n} load${n === 1 ? '' : 's'} so far — this line builds up with every scheduled refresh during the proof period.</div>` : ''}</div>
      <div class="card"><h3>Risk measures per data load</h3><div class="chartbox"><canvas id="t4"></canvas></div></div></div>`;
  S.charts.forEach(ch => ch.destroy()); S.charts = [];
  const ser = (name, key, data) => ({ name, key, data });
  S.charts.push(drawChart(t1, { type: 'line', unit: 'UGX', labels: weeks, series: [ser('Consumption', 'seq', weeks.map(w => byWeek[w].c)), ser('Output', 'good', weeks.map(w => byWeek[w].o)), ser('Sales (cost)', 'FG', weeks.map(w => byWeek[w].s)), ser('Purchase receipts', 'serious', weeks.map(w => byWeek[w].r))] }));
  S.charts.push(drawChart(t2, { type: 'bar', unit: 'UGX', stacked: true, labels: weeks, series: [ser('Raw Material', 'RM', cls('RM')), ser('Work in Progress', 'WIP', cls('WIP')), ser('Finished Goods', 'FG', cls('FG'))] }));
  S.charts.push(drawChart(t3, { type: n > 1 ? 'line' : 'bar', unit: 'UGX', labels: lab, series: [ser('Raw Material', 'RM', k.map(x => x.rm_value)), ser('Work in Progress', 'WIP', k.map(x => x.wip_value)), ser('Finished Goods', 'FG', k.map(x => x.fg_value))] }));
  S.charts.push(drawChart(t4, { type: n > 1 ? 'line' : 'bar', unit: 'items', labels: lab, series: [ser('Out of stock', 'crit', k.map(x => x.out_of_stock)), ser('Run out ≤7 days', 'serious', k.map(x => x.run_out_7d)), ser('Overdue PO lines', 'warning', k.map(x => x.overdue_lines)), ser('Constrained products', 'seq', k.map(x => x.constrained))] }));
}

/* ----- data refresh ----- */
async function renderDataRefresh() {
  const [s, log] = await Promise.all([api('/api/schedules'), api('/api/refresh/log')]);
  S.meta = await api('/api/meta');
  const n = S.meta.notes, r = n.reconciliation, rf = s.refresh, last = log[0];
  document.getElementById('content').innerHTML = `<div class="vhead"><div><h1>Data refresh</h1><p>Read-only loads from Business Central ${esc(n.environment)}, the run log and reconciliation after each load.</p></div>
      <button class="btn primary" id="rnow">${svg('refresh', 14)} ${S.meta.refreshing ? 'Refreshing…' : 'Refresh now'}</button></div>
    ${S.meta.last_error ? `<div class="banner" style="border-left-color:var(--critical)">Last refresh failed: ${esc(S.meta.last_error)}</div>` : ''}
    <div class="kpis"><div class="kpi"><div class="label">Data loaded</div><div class="value" style="font-size:20px">${esc(n.extracted_at.replace('T', ' '))}</div><div class="note">${esc(n.company)}</div></div>
      <div class="kpi"><div class="label"><span class="dot" style="background:${css(last && last.status === 'failed' ? '--critical' : '--good')}"></span>Last run</div><div class="value" style="font-size:20px">${last ? esc(last.status) : 'Initial load'}</div><div class="note">${last ? esc((last.started || '').replace('T', ' ').slice(0, 16)) + ' · ' + esc(last.trigger || 'manual') : ''}</div></div>
      <div class="kpi"><div class="label">Reconciliation to BC</div><div class="value">${r ? (100 * r.items_matching / r.items_compared).toFixed(1) : '–'}<small> %</small></div><div class="note">${r ? `${r.items_matching.toLocaleString()} of ${r.items_compared.toLocaleString()} items match` : ''}</div></div>
      <div class="kpi"><div class="label">Records in last load</div><div class="value">${(n.open_ledger_entries + n.movement_entries).toLocaleString()}</div><div class="note">ledger entries (open + ${n.window_days}-day movements)</div></div></div>
    <div class="charts"><div class="card"><h3>${svg('clock', 15)} Scheduled refresh</h3>
      <label class="chk"><input type="checkbox" id="rf_en" ${rf.enabled ? 'checked' : ''}> Refresh automatically</label>
      <div class="filters" style="margin:10px 0"><input type="time" id="rf_time" value="${esc(rf.time)}" style="min-width:0"> <span class="muted">EAT on</span>
        ${DAYS.map((d, i) => `<label class="chk"><input type="checkbox" class="rf_d" value="${i}" ${rf.days.includes(i) ? 'checked' : ''}> ${d}</label>`).join('')}</div>
      <button class="btn primary" id="rf_save">Save schedule</button> <span id="rf_msg" class="muted"></span>
      <div class="muted" style="margin-top:8px">Last scheduled run: ${esc((rf.last_run || '–').replace('T', ' ').slice(0, 16))}. Alerts are re-checked and scheduled reports use the new data after each load.</div></div>
      <div class="card"><h3>${svg('shield', 15)} Connection</h3><dl><dt>Source</dt><dd>${esc(n.company)} · ${esc(n.environment)}</dd><dt>Access</dt><dd>Read-only (Entra ID app, client credentials). Pulse never posts, edits or deletes Business Central records.</dd>
        <dt>Tables</dt><dd>Item Ledger Entries, Purchase Lines, Items, Locations, Vendors, Production BOM header & lines</dd></dl></div></div>
    <div class="card tablecard" id="rlog"></div>`;
  rnow.onclick = async () => { await api('/api/refresh', { method: 'POST' }); rnow.textContent = 'Refreshing… (about 2 minutes)';
    const t = setInterval(async () => { const m = await api('/api/meta'); if (!m.refreshing) { clearInterval(t); S.meta = m; renderWhen(); if (S.view === 'datarefresh') renderDataRefresh(); } }, 5000); };
  rf_save.onclick = async () => { await api('/api/schedules/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: rf_en.checked, time: rf_time.value, days: [...document.querySelectorAll('.rf_d:checked')].map(x => +x.value) }) }); rf_msg.textContent = 'Saved.'; };
  renderTable(document.getElementById('rlog'), { title: 'Refresh run log', total_rows: log.length, drill: null,
    columns: [{ field: 'started', label: 'Started (EAT)', kind: 'text' }, { field: 'trigger', label: 'Trigger', kind: 'text' }, { field: 'user', label: 'By', kind: 'text' }, { field: 'status', label: 'Status', kind: 'status' },
      { field: 'seconds', label: 'Seconds', kind: 'qty' }, { field: 'records', label: 'Records', kind: 'qty' }, { field: 'recon_pct', label: 'Reconciliation %', kind: 'days' }, { field: 'detail', label: 'Detail', kind: 'text' }],
    rows: log.map(x => ({ ...x, started: (x.started || '').replace('T', ' ').slice(0, 19), status: x.status === 'ok' ? 'Healthy' : 'Failed', detail: x.error || (x.alerts_triggered && x.alerts_triggered.length ? 'Alerts: ' + x.alerts_triggered.join('; ') : '') })) }, { size: 15 });
}

/* ----- audit ----- */
async function renderAudit() {
  const rows = await api('/api/audit');
  const types = [...new Set(rows.map(r => r.type).filter(Boolean))];
  document.getElementById('content').innerHTML = `<div class="vhead"><div><h1>Audit log</h1><p>Every question, agent run, decision, report and data refresh — with who and when.</p></div></div>
    <div class="filters"><select id="a_t"><option value="">All events</option>${types.map(t => `<option>${esc(t)}</option>`).join('')}</select><input id="a_q" placeholder="Search user, question, report…"></div><div class="card tablecard" id="alog"></div>`;
  const draw = () => {
    const q = a_q.value.toLowerCase(), t = a_t.value;
    const f = rows.filter(r => (!t || r.type === t) && (!q || JSON.stringify(r).toLowerCase().includes(q)));
    renderTable(document.getElementById('alog'), { title: 'Events', total_rows: f.length, drill: null,
      columns: [{ field: 'at', label: 'When', kind: 'text' }, { field: 'user', label: 'User', kind: 'text' }, { field: 'type', label: 'Type', kind: 'text' }, { field: 'event', label: 'Event', kind: 'text' }, { field: 'detail', label: 'Detail', kind: 'text' }],
      rows: f.map(r => ({ ...r, at: String(r.at || '').replace('T', ' ').slice(0, 19) })) }, { size: 30 });
  };
  a_t.onchange = draw; let tm; a_q.oninput = () => { clearTimeout(tm); tm = setTimeout(draw, 300); }; draw();
}

/* ---------------- Definitions ---------------- */
function renderDefinitions() {
  const n = S.meta.notes, r = n.reconciliation;
  document.getElementById('content').innerHTML = `<div class="vhead"><div><h1>Definitions & data notes</h1><p>How every measure is calculated, and what the data profiling found.</p></div></div>
    <div class="charts">
    <div class="card"><h3>Measure definitions</h3><dl>${Object.entries(S.meta.definitions).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
    <div class="card"><h3>Data notes (this load)</h3><dl>
      <dt>Source</dt><dd>${esc(n.company)} · ${esc(n.environment)} · extracted ${esc(n.extracted_at)}</dd>
      <dt>Reporting window</dt><dd>${n.window_days} days (${n.production_days} days with production output)</dd>
      <dt>Ledger</dt><dd>${n.open_ledger_entries.toLocaleString()} open entries (stock); ${n.movement_entries.toLocaleString()} movements in window</dd>
      <dt>Reconciliation to BC item inventory</dt><dd>${r ? `${r.items_matching.toLocaleString()} of ${r.items_compared.toLocaleString()} items match exactly (${(100 * r.items_matching / r.items_compared).toFixed(1)}%).` : 'Run a refresh to compute.'}</dd>
      <dt>Purchase lines</dt><dd>${n.purchase_lines_outstanding} outstanding lines; <b>${n.purchase_lines_overdue}</b> past expected receipt date, of which ${n.purchase_lines_stale} are more than ${n.stale_after_days} days overdue (stale, excluded from projections).</dd>
      <dt>Bills of Materials</dt><dd>${n.bom_lines_certified.toLocaleString()} certified BOM item lines; <b>${n.bom_lines_zero_qty.toLocaleString()}</b> have Quantity per = 0 and are excluded.</dd>
      <dt>Unclassified items with stock</dt><dd>${n.items_unclassified_with_stock.toLocaleString()} items (spares, consumables, stationery etc.) are outside RM/WIP/FG.</dd>
    </dl>${r && r.mismatches.length ? '<div id="recon" style="margin-top:12px"></div>' : ''}</div></div>`;
  if (r && r.mismatches.length) renderTable(document.getElementById('recon'), { title: 'Reconciliation mismatches', total_rows: r.mismatches.length, drill: 'item_no',
    columns: [{ field: 'item_no', label: 'Item', kind: 'text' }, { field: 'bc', label: 'BC inventory', kind: 'qty' }, { field: 'pulse', label: 'Pulse stock', kind: 'qty' }], rows: r.mismatches }, { size: 10 });
}

init();
</script>
</body>
</html>
