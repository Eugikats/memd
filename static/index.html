<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMD Decision Intelligence</title>
<link rel="icon" type="image/svg+xml" href="/static/memd-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@2.3.1/dist/chartjs-chart-treemap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@0.12.1/dist/chartjs-chart-sankey.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f6fa; --surface-1: #ffffff; --surface-2: #f6f8fb; --surface-3: #eef2f8; --border: #e6e9ef; --border-strong: #d9dee7;
  --text-primary: #0f1b33; --text-secondary: #5b6478; --text-muted: #8a93a6;
  --accent: #1f6bff; --accent-hover: #1658d6; --accent-soft: #eaf1ff; --grid: #eef0f4;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --serif: "Source Serif 4", Georgia, serif;
  --shadow: 0 10px 30px -12px rgba(31, 54, 99, .18), 0 2px 6px rgba(31, 54, 99, .05);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text-primary); font: 14px/1.45 Inter, system-ui, sans-serif; }
button { font: inherit; }
.app { display: grid; grid-template-columns: auto 1fr; min-height: 100vh; }

/* ---------- side rail ---------- */
.rail-slot { width: 260px; position: relative; }
.rail-slot.collapsed { width: 64px; }
.rail { width: 100%; background: var(--surface-1); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden; }
.rail-slot.collapsed.peeking .rail { position: absolute; left: 0; top: 0; width: 260px; height: 100vh; z-index: 45; box-shadow: 12px 0 36px rgba(15, 27, 51, .16); }
.rail-head { height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.rail.collapsed:not(.peek):not(.open) .rail-head { flex-direction: column; height: auto; justify-content: center; gap: 4px; padding: 8px 4px; }
.rail .logo { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 0; text-decoration: none; color: inherit; }
.logo-img { width: 32px; height: 32px; flex: none; object-fit: contain; background: transparent; border: 0; padding: 0; border-radius: 8px; }
.logo-mark { width: 36px; height: 36px; flex: none; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 700; font-family: var(--serif); font-size: 20px;
  background: linear-gradient(135deg, #1f6bff, #4aa3ff); box-shadow: 0 4px 10px -3px rgba(31,107,255,.5); }
.logo-text { font-weight: 700; font-size: 12.5px; letter-spacing: -.01em; line-height: 1.15; white-space: nowrap; }
.logo-text small { display: block; font-weight: 500; font-size: 11px; color: var(--text-muted); letter-spacing: 0; }
.rail .toggle { margin: 0; width: 28px; height: 28px; border: 0; background: none; color: #94a3b8; border-radius: 6px; cursor: pointer; display: grid; place-items: center; flex: none; padding: 0; }
.rail .toggle:hover { background: #f1f5f9; color: #334155; }
.rail .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 10px 10px; display: flex; flex-direction: column; min-height: 0; }
.nav-block { display: flex; flex-direction: column; gap: 2px; }
.nav-break { height: 0; border-top: 1px solid #f1f5f9; margin: 12px 6px; }
.recent { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f1f5f9; display: flex; flex-direction: column; min-height: 0; flex: 1; }
.recent-head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 6px; }
.recent-head span { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; }
.recent-new { border: 0; background: transparent; color: #1769FF; font-size: 11px; font-weight: 600; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.recent-new:hover { background: #eff6ff; }
.recent-list { display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.recent-item { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 7px 8px; cursor: pointer; color: #475569; }
.recent-item b { font-size: 13px; font-weight: 600; color: #0f172a; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-item em { font-style: normal; font-size: 11px; color: #94a3b8; display: flex; width: 100%; justify-content: space-between; gap: 8px; }
.recent-item em span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-item.on, .recent-item:hover { background: #f1f5f9; }
.recent-empty { margin: 0; padding: 0 8px; font-size: 12px; color: #94a3b8; }
.rail.collapsed:not(.peek) .recent-label,
.rail.collapsed:not(.peek) .recent-body,
.rail.collapsed:not(.peek) .recent-new span { display: none; }
.rail.collapsed:not(.peek) .recent { flex: none; margin-top: 16px; align-items: center; padding-top: 12px; }
.rail.collapsed:not(.peek) .recent-head { justify-content: center; padding: 0; }
.rail.collapsed.peek .recent-body { display: block; }
.rail .sep { height: 1px; background: var(--border); margin: 10px 4px; }
.rail .group { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 8px 8px 4px; white-space: nowrap; }
.rail.collapsed .group, .rail.collapsed .lbl, .rail.collapsed .logo-text, .rail.collapsed .foot .who { display: none; }
.rail.collapsed.peek .lbl, .rail.peek .lbl, .rail.collapsed.peek .logo-text, .rail.peek .logo-text, .rail.collapsed.peek .foot .who, .rail.peek .foot .who { display: block; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; cursor: pointer; font-size: 13px; white-space: nowrap; }
.rail a svg { flex: none; width: 16px; height: 16px; }
.rail a .no { flex: none; width: 18px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.rail a:hover { background: var(--surface-2); color: var(--text-primary); }
.rail a .lbl { overflow: hidden; text-overflow: ellipsis; }
.rail a.active { background: var(--accent-soft); color: var(--accent); }
.rail a.active .no { color: var(--accent); }
.rail .foot { padding: 8px; border-top: 1px solid var(--border); }
.rail-user { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; border-radius: 8px; padding: 8px; cursor: pointer; text-align: left; color: inherit; }
.rail-user:hover { background: #f1f5f9; }
.rail.collapsed .rail-user { justify-content: center; padding: 8px 0; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #5b7cfa; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.avatar.ghost { background: var(--surface-3); color: var(--text-muted); }

/* ---------- top bar ---------- */
.shell { min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 62px; background: var(--surface-1); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 12px; position: sticky; top: 0; z-index: 5; }
.topbar .page { font-weight: 600; font-size: 14.5px; }
.topbar .right { display: flex; align-items: center; gap: 14px; }
.topbar .when { text-align: right; line-height: 1.25; }
.topbar .when b { display: block; font-size: 14px; }
.topbar .when a { font-size: 12px; color: var(--text-secondary); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; cursor: pointer; }
.topbar .when a:hover { color: var(--accent); }
.topbar .when .offline-mode { display: inline-block; margin-top: 3px; padding: 3px 8px; border: 1px solid #f0d9a6; border-radius: 999px; background: #fff8e8; color: #875500; font-size: 10.5px; font-weight: 700; letter-spacing: .025em; }
main { padding: 16px 24px 48px; flex: 1; min-width: 0; }

/* ---------- command center home ---------- */
.hero { background: #fff; border-radius: 0; padding: 56px 24px 48px; min-height: calc(100vh - 88px); display: flex; flex-direction: column; align-items: center; }
.hero:not(.chatting) { height: calc(100vh - 62px); max-height: calc(100vh - 62px); min-height: 0; padding: 20px 24px 8px; box-sizing: border-box; overflow: hidden; }
.hero:not(.chatting) .askbox { margin-top: 16px; }
.hero:not(.chatting) .thread { display: none; }
.hero:not(.chatting) .chips { margin-top: 12px; }
.cockpit-kicker { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #94a3b8; }
.hero h1 { font-family: "Times New Roman", "Source Serif 4", Times, serif; font-weight: 700; font-size: 46px; letter-spacing: -.6px; margin: 12px 0 0; text-align: center; color: #0B1640; }
.hero h1 span { color: #0B1640; }
.hero-rule { width: 42px; height: 3px; border-radius: 3px; background: #2563EB; margin: 14px auto 0; }
.hero.chatting { padding-top: 24px; }
.hero.chatting h1 { font-size: 26px; }
.hero.chatting .cockpit-kicker, .hero.chatting .hero-rule, .hero.chatting .cockpit, .hero.chatting .cockpit-wave, .hero.chatting .flow-toggle { display: none; }
.askbox { width: min(720px, 100%); margin-top: 28px; background: #fff; border: 1px solid #e6edf5; border-radius: 999px; box-shadow: 0 10px 30px rgba(15, 23, 42, .06); display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 18px; }
.hero.chatting .askbox { margin-top: 16px; position: sticky; bottom: 16px; }
.askbox svg.spark { width: 22px; height: 22px; color: var(--accent); flex: none; }
.askbox input { flex: 1; border: 0; outline: 0; background: none; font: inherit; font-size: 15px; color: var(--text-primary); padding: 12px 0; min-width: 0; }
.askbox input::placeholder { color: var(--text-muted); }
.askbox .send { width: 42px; height: 42px; border-radius: 50%; border: 0; background: #e6edf5; color: #94a3b8; cursor: default; display: grid; place-items: center; flex: none; }
.askbox .send.ready { background: #2563EB; color: #fff; cursor: pointer; }
.assist-fab { position: fixed; right: 20px; bottom: 20px; z-index: 70; width: 52px; height: 52px; padding: 4px; border: 0; background: transparent; color: #6B9BFF; cursor: pointer; display: grid; place-items: center; }
.assist-fab:hover { color: #1769FF; }
.assist-fab svg { width: 44px; height: 44px; }
body.assist-open .assist-fab { display: none; }
.assist-mask { position: fixed; inset: 0; z-index: 76; background: rgba(15, 23, 42, .28); display: flex; align-items: flex-end; justify-content: center; }
.assist-mask[hidden] { display: none; }
.assist-panel { position: relative; width: 100%; height: 100dvh; display: flex; flex-direction: column; background: #fff; box-shadow: 0 24px 60px rgba(15, 23, 42, .22); }
.assist-tools { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; gap: 2px; }
.assist-tools button { width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #64748b; cursor: pointer; display: grid; place-items: center; }
.assist-tools button:hover, .assist-tools button.on { background: #f1f5f9; color: #1769FF; }
.assist-hero { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 56px 24px 16px; overflow: auto; background: #fff; }
.assist-hero:not(.chatting) { justify-content: center; padding-top: 24px; padding-bottom: 24px; }
.assist-hero:not(.chatting) .thread { display: none; }
.assist-hero h1 { font-family: "Times New Roman", "Source Serif 4", Times, serif; font-weight: 700; font-size: 40px; letter-spacing: -.6px; margin: 12px 0 0; text-align: center; color: #0B1640; }
.assist-hero h1 span { color: #0B1640; }
.assist-hero .thread { width: min(720px, 100%); margin-top: 18px; }
.assist-hero .askbox { width: min(720px, 100%); margin-top: 16px; }
.assist-hero.chatting { padding-top: 56px; }
.assist-hero.chatting h1 { font-size: 26px; }
.assist-hero.chatting .askbox { position: sticky; bottom: 8px; }
.assist-recent { width: min(720px, 100%); flex: 1; min-height: 0; overflow: auto; margin-top: 18px; }
.assist-recent p.lab { margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; }
.assist-recent[hidden] { display: none; }
@media (min-width: 640px) {
  .assist-mask { align-items: center; padding: 16px; }
  .assist-panel { height: min(640px, calc(100dvh - 2rem)); max-width: 900px; border-radius: 16px; overflow: hidden; }
}
@media (min-width: 1024px) {
  .assist-fab { right: 32px; bottom: 32px; width: 56px; height: 56px; }
  .assist-fab svg { width: 48px; height: 48px; }
}
.cockpit { width: min(980px, 100%); margin-top: 42px; }
.cockpit-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 16px; text-align: center; }
.cockpit-metrics .lab { margin: 0; font-size: 13px; color: #64748b; font-weight: 500; }
.cockpit-metrics .val { margin: 6px 0 0; font-family: "Times New Roman", "Source Serif 4", Times, serif; font-size: 32px; font-weight: 700; letter-spacing: -.04em; color: #0B1640; line-height: 1.05; }
.cockpit-metrics .val small { font-size: .62em; }
.cockpit-metrics .val .u { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #94a3b8; letter-spacing: 0; margin-left: 4px; }
.cockpit-metrics .share { margin: 4px 0 0; min-height: 16px; font-size: 12px; color: #94a3b8; }
.cockpit-wave { position: relative; flex: 1 1 auto; min-height: 0; width: calc(100% + 48px); margin: 6px -24px 0; background: #fff; overflow: hidden; }
.wave-clip { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; overflow: hidden; background: #fff; }
.wave-clip img { width: 100%; height: auto; display: block; margin-top: -11.6%; background: #fff; }
.wave-clip svg { width: 100%; height: 100%; display: block; overflow: visible; }
.wave-metric { position: absolute; top: 0; bottom: 46%; display: flex; flex-direction: column; justify-content: flex-end; text-align: center; transform: translateX(-50%); padding-bottom: 2px; }
.wave-metric .lab { margin: 0; font-size: 13px; color: #64748b; font-weight: 500; white-space: nowrap; }
.wave-metric .val { margin: 4px 0 0; font-family: "Times New Roman", "Source Serif 4", Times, serif; font-size: clamp(18px, 2.1vw, 32px); font-weight: 700; letter-spacing: -.04em; color: #0B1640; line-height: 1.05; }
.wave-metric .val .u { font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 600; color: #94a3b8; letter-spacing: 0; margin-left: 4px; }
.wave-delta { min-height: 34px; transition: opacity .45s ease; }
.wave-delta.out { opacity: 0; }
.wave-delta .chg { margin: 5px 0 0; font-size: 13px; font-weight: 650; line-height: 1.2; }
.wave-delta .chg.up { color: #15945a; }
.wave-delta .chg.down { color: #d03b3b; }
.wave-delta .chg.flat, .wave-delta .chg.info { color: #94a3b8; }
.wave-delta .chg span { margin-right: 2px; }
.wave-delta .vs { margin: 1px 0 0; font-size: 11.5px; color: #94a3b8; line-height: 1.25; white-space: normal; }
.flow-toggle { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% + 48px); margin: 0 -24px 0; border: 0; background: transparent; color: #b6c0cc; font-size: 11px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; cursor: pointer; }
.flow-toggle svg { transition: transform .15s; }
.flow-toggle.open svg { transform: rotate(180deg); }
.cockpit-more { width: 100%; margin-top: 16px; }
.cockpit-more .flow-note { text-align: center; font-size: 12.5px; color: #64748b; margin: 0 0 12px; }
.flow-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin-bottom: 16px; font-size: 12.5px; color: #334155; }
.flow-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.divider { width: min(768px, 100%); display: flex; align-items: center; gap: 14px; margin: 56px 0 18px; color: var(--text-muted); font-size: 11.5px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 500; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border-strong); }
.insights { width: min(768px, 100%); display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.insight { display: flex; flex-direction: column; justify-content: flex-start; background: rgba(255,255,255,.75); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: left; cursor: pointer; color: inherit; transition: box-shadow .15s, border-color .15s, transform .15s; }
.insight:hover { box-shadow: var(--shadow); border-color: var(--border-strong); transform: translateY(-1px); }
.insight .lab { font-size: 11.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; font-weight: 500; }
.insight .val { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 6px 0 2px; }
.insight .txt { font-size: 12.5px; color: var(--text-secondary); }
.insight .go { font-size: 12px; color: var(--accent); margin-top: 8px; font-weight: 500; }
.insight.skeleton { height: 128px; background: linear-gradient(90deg, #f1f3f8, #f8f9fc, #f1f3f8); background-size: 200% 100%; animation: sh 1.4s infinite; cursor: default; }
@keyframes sh { to { background-position: -200% 0; } }
.thread { width: min(860px, 100%); display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
.msg { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; box-shadow: 0 1px 2px rgba(15,27,51,.04); min-width: 0; }
.msg.user { align-self: flex-end; max-width: 75%; background: var(--accent); color: #fff; border-color: var(--accent); border-radius: 18px 18px 4px 18px; padding: 10px 16px; }
.msg .basis { color: var(--text-muted); font-size: 12px; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
.msg p { margin: 6px 0; } .msg ul { margin: 6px 0; padding-left: 20px; }
.msg > div > table { border: 1px solid var(--border); border-radius: 8px; display: block; overflow-x: auto; }
.thinking { display: inline-flex; gap: 4px; } .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .3; animation: bl 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes bl { 50% { opacity: 1; } }
.rail .badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 600; border-radius: 9px; padding: 0 6px; line-height: 17px; min-width: 18px; text-align: center; }
.rail.collapsed a { position: relative; }
.rail.collapsed .badge { position: absolute; top: 2px; left: 26px; }
.rail a .no.lbl { margin-left: auto; width: auto; }
.chips { width: min(920px, 100%); display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }
.chips button { display: inline-flex; align-items: center; gap: 7px; background: #fff; border: 1px solid #e7eef6; color: #526277; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
.chips button:hover { border-color: var(--accent); color: var(--accent); }
.chips svg { color: var(--accent); }
.hero.chatting .chips { margin-top: 10px; }
.steps { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 12.5px; }
.steps summary { cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; font-weight: 500; }
.steps summary svg { color: var(--good); }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0 2px; }
.step .n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.acts-head { margin: 12px 0 8px; font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; color: var(--text-secondary); }
.acts, .alist { display: flex; flex-direction: column; gap: 10px; }
.alist { margin-bottom: 12px; }
.action { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.action.approved { border-left: 3px solid var(--good); } .action.dismissed { opacity: .65; } .action.proposed { border-left: 3px solid var(--warning); }
.a-top { display: flex; gap: 12px; align-items: flex-start; }
.a-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); }
.a-ic.k-alert { background: #fff4dc; color: #b77a00; } .a-ic.k-transfer { background: #e3f6ee; color: #11845a; } .a-ic.k-briefing { background: #efeaff; color: #5b47c9; }
.a-main { flex: 1; min-width: 0; } .a-title { font-weight: 600; }
.action details { margin-top: 8px; } .action summary { cursor: pointer; color: var(--accent); font-size: 12.5px; display: inline-flex; gap: 5px; align-items: center; }

.post-bub span { font-size: 10px; font-weight: 500; opacity: .92; }

.inv-legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; }
.inv-legend i { width: 8px; height: 8px; border-radius: 50%; }
.inv-legend .nm { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.inv-legend .nm b { font-weight: 600; }
.inv-legend .sh { color: #64748b; font-variant-numeric: tabular-nums; font-weight: 500; }
.inv-legend em { font-style: normal; font-weight: 600; font-variant-numeric: tabular-nums; }
.inv-pager button:disabled { opacity: .45; cursor: default; }
.page-inv .insights-card, body.page-inv .insights-card { border-radius: 16px; }
.inv-table { border-radius: 16px; }
.inv-tablehead { flex-wrap: nowrap; align-items: center; }
.inv-tablehead h3 { font-size: 15px; min-width: 0; }
.inv-tablehead .rbtns { flex-wrap: nowrap; width: auto; flex: none; }
body.page-inv .tablehead.inv-tablehead .rbtns { width: auto; }
.inv-table .tablewrap { border: 0; border-radius: 0; }
.inv-table th { background: #f8fafc; font-size: 12px; }
.inv-table tbody tr:hover td { background: #f8fbff; }
.inv-sku { color: #2457d6; font-weight: 600; }
.inv-table .cls { color: var(--c); background: color-mix(in srgb, var(--c) 14%, white); }
.inv-days { font-weight: 700; font-variant-numeric: tabular-nums; }
.inv-table .pill.tone-good { background: #e9f8ef; color: #128a3e; border-color: transparent; }
.inv-table .pill.tone-warn { background: #fff4e6; color: #c26a00; border-color: transparent; }
.inv-table .pill.tone-bad { background: #fdecec; color: #c43535; border-color: transparent; }
.inv-table .pill.tone-good .dot, .inv-table .pill.tone-warn .dot, .inv-table .pill.tone-bad .dot { display: none; }
.inv-table .inv-search { flex: 0 1 220px; min-width: 140px; }
.inv-table .inv-search input { padding: 6px 0; font-size: 12.5px; }
.colmenu-wrap { position: relative; }
.colmenu { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 8px 10px; z-index: 6; min-width: 190px; max-height: 280px; overflow: auto; }
.colmenu.open { display: flex; flex-direction: column; gap: 2px; }
.colmenu label { display: flex; gap: 8px; align-items: center; font-size: 12.5px; padding: 4px 2px; cursor: pointer; font-weight: 400; color: var(--text-primary); }
.inv-pager { width: 100%; }
.inv-pager .pg { min-width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--text-secondary); }
.inv-pager .pg.on { background: #2563EB; color: #fff; border-color: #2563EB; }
.inv-pager .ellipsis { color: var(--text-muted); padding: 0 2px; }
.inv-pager .rpp { margin-left: auto; color: #64748b; font-size: 12.5px; display: inline-flex; align-items: center; gap: 8px; }
.inv-pager select { border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font: inherit; background: #fff; }
@media (max-width: 1200px) {
  .inv-kpis, .inv-kpis.cols-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .inv-lower { grid-template-columns: 1fr; }
  .inv-topcharts { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .inv-kpis, .inv-kpis.cols-6 { grid-template-columns: 1fr 1fr; }
  .inv-head h1 { font-size: 24px; }
  .inv-kpi-v { font-size: 18px; }
  .inv-spark { max-width: 72px; height: 26px; }
  .inv-ring { width: 36px; height: 36px; }
  .post-row, .post-axis { grid-template-columns: minmax(64px, 100px) minmax(0, 1fr); }
  .post-val { grid-column: 2; justify-self: end; }
  .post-axis span:last-child { display: none; }
  .inv-donut { grid-template-columns: 1fr; }
  .inv-actions .btn { flex: 1; justify-content: center; }
}
@media (max-width: 900px) {
  .inv-head { flex-wrap: wrap; align-items: stretch; }
  .inv-head .sec-tabs, .page-tools .sec-tabs, .vhead .sec-tabs {
    display: flex; flex: 1 1 100%; width: 100%; max-width: 100%; min-width: 0; overflow-x: auto;
  }
  .inv-head .inv-actions { width: 100%; margin-left: 0; flex: 1 1 100%; flex-wrap: wrap; }
  .page-tools, .vhead .page-tools {
    flex: 1 1 100%; width: 100%; min-width: 0; margin-left: 0;
    flex-direction: column; align-items: stretch; justify-content: flex-start;
  }
}

async function takeUpload(file, host) {
  if (!file) return;
  const localId = 'up-' + Date.now();
  const row = document.createElement('div');
  row.className = 'msg';
  row.innerHTML = `<div class="answer">Uploading ${esc(file.name)}…</div>`;
  const thread = threadHost(host) || threadHost('assist') || threadHost('hero');
  if (thread) {
    thread.hidden = false;
    thread.append(row);
    S.thread.push(row);
    thread.scrollTop = thread.scrollHeight;
  }
  const hero = document.getElementById('hero');
  if (hero && host !== 'assist') hero.classList.add('chatting');
  const popup = document.querySelector('.assist-hero');
  if (popup && host === 'assist') popup.classList.add('chatting');
  S.uploads = [...(S.uploads || []), { id: localId, name: file.name, pending: true }];
  paintUploads();
  const body = new FormData();
  body.append('file', file);
  try {
    const res = await fetch('/api/documents', { method: 'POST', body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) {
      const fallback = res.status === 413 ? 'That file is too large for the server.'
        : res.status ? `Could not read that file (HTTP ${res.status}).` : 'Could not read that file.';
      throw new Error(data.error || fallback);
    }
    S.uploads = [...(S.uploads || []).filter(d => d.id !== localId && d.id !== data.id), data].slice(-4);
    paintUploads();
    row.innerHTML = `<div class="answer">Attached ${esc(data.name)}.</div>`;
  } catch (err) {
    S.uploads = (S.uploads || []).map(d => d.id === localId ? { id: localId, name: file.name, error: err.message } : d);
    paintUploads();
    row.innerHTML = `<div class="answer">${esc(file.name)} was not attached. ${esc(err.message)}</div>`;
  }
}

function openCropper(file, title) {
  return new Promise(resolve => {
    if (!file || !['image/png', 'image/jpeg', 'image/jpg', 'image/webp', 'image/gif'].includes((file.type || '').toLowerCase())) {
      resolve({ error: 'Use a PNG, JPEG, WebP or GIF image.' }); return;
    }
    if (file.size > 8 * 1024 * 1024) { resolve({ error: 'Image is too large to edit. Choose a file under 8 MB.' }); return; }
    const url = URL.createObjectURL(file);
    const mask = document.createElement('div');
    mask.className = 'crop-mask';
    mask.innerHTML = `<div class="crop-dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><div><h3>${esc(title)}</h3><p>Drag and zoom to fit the circle.</p></div><button type="button" class="crop-x" data-x title="Close">${svg('x', 16)}</button></header>
      <div class="crop-stage" id="cropStage"><img id="cropImg" alt=""></div>
      <div class="crop-foot"><label>Zoom<input type="range" id="cropZoom" min="1" max="3" step="0.05" value="1"></label>
        <div class="crop-actions"><button type="button" class="set-ghost" data-x>Cancel</button><button type="button" class="set-save" id="cropSave">Save</button></div>
        <p class="set-note" id="cropErr" hidden></p></div></div>`;
    document.body.appendChild(mask);
    const img = mask.querySelector('#cropImg'), stage = mask.querySelector('#cropStage');
    const frame = 288;
    let zoom = 1, dx = 0, dy = 0, cover = 1, natW = 1, natH = 1;
    const layout = () => {
      const w = natW * cover * zoom, h = natH * cover * zoom;
      const maxX = Math.max(0, (w - frame) / 2), maxY = Math.max(0, (h - frame) / 2);
      dx = Math.max(-maxX, Math.min(maxX, dx));
      dy = Math.max(-maxY, Math.min(maxY, dy));
      img.style.width = w + 'px'; img.style.height = h + 'px';
      img.style.left = ((frame - w) / 2 + dx) + 'px';
      img.style.top = ((frame - h) / 2 + dy) + 'px';
    };
    img.onload = () => { natW = img.naturalWidth; natH = img.naturalHeight; cover = Math.max(frame / natW, frame / natH); layout(); };
    img.src = url;
    mask.querySelector('#cropZoom').oninput = e => { zoom = Number(e.target.value); layout(); };
    let drag = null;
    stage.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, dx, dy }; stage.setPointerCapture(e.pointerId); };
    stage.onpointermove = e => { if (!drag) return; dx = drag.dx + (e.clientX - drag.x); dy = drag.dy + (e.clientY - drag.y); layout(); };
    stage.onpointerup = () => { drag = null; };
    const close = result => { URL.revokeObjectURL(url); mask.remove(); resolve(result); };
    mask.querySelectorAll('[data-x]').forEach(b => b.onclick = () => close(null));
    mask.addEventListener('click', e => { if (e.target === mask) close(null); });
    mask.querySelector('#cropSave').onclick = () => {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 512;
      const ctx = canvas.getContext('2d');
      const w = natW * cover * zoom, h = natH * cover * zoom;
      const left = (frame - w) / 2 + dx, top = (frame - h) / 2 + dy, k = 512 / frame;
      ctx.beginPath(); ctx.arc(256, 256, 256, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
      ctx.drawImage(img, left * k, top * k, w * k, h * k);
      let data = canvas.toDataURL('image/jpeg', 0.86);
      if (data.length > 1400000) data = canvas.toDataURL('image/jpeg', 0.7);
      try { close(data); } catch { const err = mask.querySelector('#cropErr'); err.hidden = false; err.textContent = 'Could not save that image.'; }
    };
  });
}

function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

function cockpitDelta(f) {
  const dir = f.dir === 'up' || f.dir === 'down' ? f.dir : (f.dir === 'flat' ? 'flat' : 'info');
  const arrow = dir === 'up' ? '↑' : dir === 'down' ? '↓' : '';
  return `<p class="chg ${dir}">${arrow ? `<span>${arrow}</span>` : ''}${esc(f.value)}</p><p class="vs">${esc(f.vs)}</p>`;
}
function paintCockpit(decks, step, animate) {
  document.querySelectorAll('#cockpitWave .wave-delta').forEach(el => {
    const list = decks[+el.dataset.slot] || [];
    if (!list.length) return;
    const frame = list[step % list.length];
    const write = () => { el.classList.remove('out'); el.innerHTML = cockpitDelta(frame); };
    if (!animate) { write(); return; }
    el.classList.add('out');
    setTimeout(() => { if (el.isConnected) write(); }, 420);
  });
}

async function loadCockpit() {
  const wave = document.getElementById('cockpitWave');
  if (S.view !== 'command' || !wave) return;
  let feed = { metrics: [], frames: [] };
  try { feed = await api('/api/cockpit'); } catch (e) { feed = { metrics: [], frames: [] }; }
  if (S.view !== 'command' || !document.getElementById('cockpitWave')) return;
  const peaks = [
    { x: 14, w: 16 },
    { x: 40, w: 16 },
    { x: 60.1, w: 16 },
    { x: 91.1, w: 15 },
  ];
  const metrics = feed.metrics || [];
  wave.innerHTML = `<div class="wave-clip"><img src="/static/cockpit-wave.png" alt="Inventory flow"></div>` + peaks.map((p, i) => {
    const m = metrics[i] || { label: '', value: 0 };
    return `<div class="wave-metric" style="left:${p.x}%;width:${p.w}%"><p class="lab">${esc(m.label)}</p><p class="val">${moneyRich(m.value)}</p><div class="wave-delta" data-slot="${i}"></div></div>`;
  }).join('');
  const decks = [[], [], [], []];
  (feed.frames || []).forEach(f => { if (decks[f.slot]) decks[f.slot].push(f); });
  let step = 0;
  paintCockpit(decks, step, false);
  if (S.cockpitTimer) clearInterval(S.cockpitTimer);
  S.cockpitTimer = setInterval(() => { step += 1; paintCockpit(decks, step, true); }, 5000);
  api('/api/cockpit/narrate').then(extra => {
    if (S.view !== 'command') return;
    (extra.frames || []).forEach(f => {
      const deck = decks[f.slot];
      if (!deck || deck.some(x => x.value === f.value && x.vs === f.vs)) return;
      deck.push(f);
    });
  }).catch(() => {});
}

function excelJobAnswer(job) {
  if (!job) return 'Excel job missing.';
  if (job.status === 'failed' || job.error) return job.error || 'Excel job failed.';
  const link = job.history_id ? `\n\nDownload: [/api/reports/history/${job.history_id}/download](/api/reports/history/${job.history_id}/download)` : '';
  if (job.summary) return job.summary + link;
  const sheets = job.sheets || [];
  const filled = sheets.filter(s => s.role === 'filled');
  const kept = sheets.filter(s => s.role === 'kept');
  const lines = [
    `I rebuilt **${job.name || 'the upload'}** in the same layout using system figures.`,
    `- Rows filled: ${(job.rows || 0).toLocaleString()}`,
    `- Sheets/tables filled: ${filled.length}` + (filled.length ? ` (${filled.slice(0, 8).map(s => s.name).join(', ')})` : ''),
  ];
  if (kept.length) lines.push(`- Kept as formulas/layout: ${kept.slice(0, 8).map(s => s.name).join(', ')}`);
  if (job.matched && job.matched.length) lines.push('- Matched columns: ' + job.matched.slice(0, 12).join(', '));
  if (job.unmatched && job.unmatched.length) lines.push('- Left blank (no system field): ' + job.unmatched.slice(0, 12).join(', '));
  if (job.unsupported && job.unsupported.length) lines.push('- Flags: ' + job.unsupported.slice(0, 8).join('; '));
  lines.push('No upload number was copied.');
  if (job.history_id) lines.push(`Download: [/api/reports/history/${job.history_id}/download](/api/reports/history/${job.history_id}/download)`);
  return lines.join('\n');
}

async function pollExcelJob(jobId, pending, hosts) {
  const started = Date.now();
  const maxMs = 15 * 60 * 1000;
  while (Date.now() - started < maxMs) {
    await new Promise(r => setTimeout(r, 1500));
    let job;
    try { job = await api('/api/excel/jobs/' + jobId); } catch (e) { continue; }
    // Unknown-job JSON has error but no status — keep polling briefly; do not treat failed jobs as retryable.
    if (!job) continue;
    if (!job.status && job.error) continue;
    if (job.status === 'ready' || job.status === 'failed') return job;
    const pct = job.progress != null ? job.progress : 0;
    const label = job.message || job.status || 'Working…';
    pending.forEach(a => {
      a.innerHTML = `<div class="steps live"><div class="step"><span class="thinking"><i></i><i></i><i></i></span> Excel engine: ${esc(label)} (${pct}%)</div></div>`;
    });
    hosts.forEach(thread => { thread.scrollTop = thread.scrollHeight; });
  }
  return { status: 'failed', error: 'Excel job timed out after 15 minutes. Check Reports history or try again.' };
}

async function ask(text, playbook, origin) {
  if (!text) return;
  const fromPopup = origin === 'popup' || (origin !== 'hero' && document.body.classList.contains('assist-open'));
  if (fromPopup) openAssist();
  else if (S.view === 'command') {
    const hero = document.getElementById('hero');
    if (hero) hero.classList.add('chatting');
  } else openAssist();
  clearComposers();
  const hosts = [threadHost('hero'), threadHost('assist')].filter(Boolean);
  const liveId = fromPopup || S.view !== 'command' ? 'assistThread' : 'heroThread';
  const thinking = `<div class="steps live"><div class="step"><span class="thinking"><i></i><i></i><i></i></span> ${playbook ? 'Agent is planning and working…' : 'Planning and querying the supply chain model…'}</div></div>`;
  const pending = hosts.map(thread => {
    const u = document.createElement('div'); u.className = 'msg user'; u.textContent = text;
    const a = document.createElement('div'); a.className = 'msg'; a.innerHTML = thinking;
    thread.append(u, a);
    if (thread.id === liveId) S.thread.push(u, a);
    thread.hidden = false;
    thread.scrollTop = thread.scrollHeight;
    return a;
  });
  syncAssist();
  let r;
  try {
    const isTemplateAsk = !playbook && /same\s+(format|template|layout)|this\s+(format|template|layout)|\brebuild\b|recreate\s+.+\btemplate\b|fill\s+(this|the)\s+template|report\s+in\s+the\s+same\s+(format|template|layout)/i.test(text)
      && readyUploads().length;
    const ctrl = new AbortController();
    // Template rebuilds return a job immediately; ordinary ask keeps the 120s guard.
    const timer = isTemplateAsk ? null : setTimeout(() => ctrl.abort(), 120000);
    try {
      r = playbook
        ? await api('/api/playbook/' + playbook, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}', signal: ctrl.signal })
        : await api('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: text, history: S.history, documents: readyUploads().map(d => d.id), emails: knownEmails(), context: fromPopup ? pageContext(S.askExtra) : '' }), signal: ctrl.signal });
    } finally {
      if (timer) clearTimeout(timer);
    }
    if (!r || r.error) throw new Error((r && r.error) || 'The agent did not return an answer.');
    if (r.excel_job && r.excel_job.id && r.excel_job.status !== 'ready' && r.excel_job.status !== 'failed') {
      pending.forEach(a => {
        a.innerHTML = `<div class="steps live"><div class="step"><span class="thinking"><i></i><i></i><i></i></span> Excel engine queued…</div></div>`;
      });
      const job = await pollExcelJob(r.excel_job.id, pending, hosts);
      r = {
        mode: 'agent',
        answer: excelJobAnswer(job),
        steps: [{ label: job.status === 'ready' ? 'Excel rebuild ready' : 'Excel job failed',
                  detail: job.history_id ? ('history_id=' + job.history_id) : (job.error || job.status) }],
        actions: [],
        tool_calls: [{ tool: 'excel_job_status', input: { job_id: job.id || r.excel_job.id } }],
        table: null,
        ui: { view: 'reports', filters: {} },
        excel_job: job,
      };
    }
  } catch (err) {
    const msg = err && err.name === 'AbortError'
      ? 'That request took too long and was stopped. Try again, or attach a smaller template.'
      : (err && err.message) || 'Could not reach the agent.';
    pending.forEach(a => { a.innerHTML = `<div class="answer">${esc(msg)}</div>`; });
    hosts.forEach(thread => { thread.scrollTop = thread.scrollHeight; });
    return;
  }
  S.history.push({ role: 'user', content: text }, { role: 'assistant', content: r.answer });
  persistChat();
  pending.forEach(a => renderAgentResult(a, r));
  updateBadge();
  hosts.forEach(thread => { thread.scrollTop = thread.scrollHeight; });
  const focus = document.getElementById(fromPopup ? 'assistQ' : 'q') || document.getElementById('assistQ');
  if (focus) focus.focus();
}

const INV_CLASS = {
  RM: '#3b82f6', WIP: '#7c5cf0', FG: '#16a34a',
  'Raw Material': '#3b82f6', 'Work in Progress': '#7c5cf0', 'Finished Goods': '#16a34a',

function cipSpark(vals, color, label) {
  const v = (vals || []).filter(x => x != null);
  const w = 112, h = 36, pad = 3;
  if (v.length < 2) {
    const y = (h / 2).toFixed(1);
    return `<svg class="inv-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}: no history" title="No historical series"><line x1="${pad}" y1="${y}" x2="${w - pad}" y2="${y}" stroke="${color}" stroke-width="1.75" stroke-linecap="round"/></svg>`;
  }
  const mn = Math.min(...v), mx = Math.max(...v), rg = (mx - mn) || 1;
  const pts = v.map((x, i) => [pad + (i / (v.length - 1)) * (w - pad * 2), h - pad - ((x - mn) / rg) * (h - pad * 2)]);
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const prev = pts[i - 1], p = pts[i], cx = prev[0] + (p[0] - prev[0]) * 0.5;
    d += ` C ${cx.toFixed(1)} ${prev[1].toFixed(1)}, ${cx.toFixed(1)} ${p[1].toFixed(1)}, ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  }
  const first = pts[0], last = pts[pts.length - 1];

function niceLabel(s) {
  const t = String(s || '').trim();
  if (t.length <= 3 || t !== t.toUpperCase() || !/[A-Z]/.test(t)) return t;
  return t.toLowerCase().replace(/(^|[\s/&-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
}

async function mountInventoryTrend() {
  const el = document.getElementById('chTrend');
  if (!el) return;
  let rows = [];
  try { rows = (await api('/api/trends')).kpi || []; } catch (e) { rows = []; }
  if (!document.getElementById('chTrend')) return;
  const draw = () => {
    const canvas = document.getElementById('chTrend');
    if (!canvas) return;
    const sorted = rows.slice().sort((a, b) => String(a.extracted_at).localeCompare(String(b.extracted_at)));
    const end = sorted.length ? new Date(sorted[sorted.length - 1].extracted_at) : new Date();
    const start = new Date(end); start.setMonth(start.getMonth() - invTrendMonths);
    const picked = sorted.filter(r => new Date(r.extracted_at) >= start);
    const use = picked.length ? picked : sorted;
    const val = r => invTrendMetric === 'rm' ? r.rm_value : invTrendMetric === 'wip' ? r.wip_value : invTrendMetric === 'fg' ? r.fg_value : (Number(r.rm_value) || 0) + (Number(r.wip_value) || 0) + (Number(r.fg_value) || 0);
    const labels = use.map(r => new Date(r.extracted_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
    const data = use.map(val);
    const nums = data.map(Number);
    const hi = nums.length ? Math.max(...nums) : 0, lo = nums.length ? Math.min(...nums) : 0;
    const tight = nums.length > 0 && hi > 0 && (hi - lo) / hi < 0.02;
    S.charts = S.charts.filter(ch => { if (ch && ch.canvas === canvas) { ch.destroy(); return false; } return true; });
    if (!data.length) { canvas.parentElement.innerHTML = '<div class="muted">No stock-value loads recorded yet.</div>'; return; }
    const chart = drawChart(canvas, { type: 'line', unit: 'UGX', labels, quiet: true, glassy: true, hideLegend: true, tight, tightMin: tight ? hi * 0.985 : undefined, tightMax: tight ? hi * 1.015 : undefined, series: [{ name: 'Inventory value', key: 'seq', data }], palette: INV_PALETTE });
    if (chart) S.charts.push(chart);
  };
  const metric = document.getElementById('trendMetric');
  if (metric) { metric.value = invTrendMetric; metric.onchange = () => { invTrendMetric = metric.value; draw(); }; }
  document.querySelectorAll('#trendRange button').forEach(b => { b.classList.toggle('on', +b.dataset.m === invTrendMonths); b.onclick = () => { invTrendMonths = +b.dataset.m; draw(); }; });
  draw();
}

  const st = { sort: valueCol ? valueCol.field : null, dir: -1, page: 0, size: opts.size || (inv ? 10 : 50), q: '', colsOpen: false, colFilter: {} };
  const hidden = new Set();
  const barCols = (inv || t.bars === false) ? [] : t.columns.filter(c => c.kind === 'money' || (c.kind === 'qty' && !/days|line|parent|component/i.test(c.label))).map(c => c.field);
  const maxOf = {}; barCols.forEach(f => maxOf[f] = Math.max(1e-9, ...t.rows.map(r => Math.abs(r[f] || 0))));
  const toneOf = v => /healthy|ready|on time|made to order/i.test(v || '') ? 'good' : /excess|no movement|^low$/i.test(v || '') ? 'warn' : /stockout|critical|high/i.test(v || '') ? 'bad' : '';
  const draw = () => {
    const valuesOf = (field, except) => {
      const base = t.rows.filter(r => Object.entries(st.colFilter).every(([f, v]) => !v || f === except || String(r[f] ?? '') === v));
      return [...new Set(base.map(r => r[field]).filter(v => v != null && String(v) !== ''))].map(String);
    };
    const repeated = new Set(t.columns.filter(c => {
      const all = [...new Set(t.rows.map(r => r[c.field]).filter(v => v != null && String(v) !== ''))];
      return all.length > 1 && all.length < t.rows.length && all.length <= 40;
    }).map(c => c.field));
    let rows = t.rows.filter(r => Object.entries(st.colFilter).every(([f, v]) => !v || String(r[f] ?? '') === v));
    const cols = t.columns.filter(c => !inv || !hidden.has(c.field));
    if (st.sort) { const f = st.sort; rows.sort((a, b) => { const x = a[f], y = b[f]; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * st.dir; }); }
    if (inv && st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => t.columns.some(c => String(r[c.field] ?? '').toLowerCase().includes(q))); }
    const pages = Math.max(1, Math.ceil(rows.length / st.size)); st.page = Math.min(st.page, pages - 1);
    const slice = rows.slice(st.page * st.size, (st.page + 1) * st.size);
    const cell = (r, c) => {
      const v = r[c.field];
      if (c.kind === 'link') return v ? `<a class="btn" href="${esc(v)}">${svg('download', 12)} Excel</a>` : '';
      if (c.kind === 'status') {
        const tone = inv ? toneOf(v) : '';
        return v ? `<span class="pill${tone ? ' tone-' + tone : ''}"><span class="dot" style="background:${statusColor(v)}"></span>${esc(v)}</span>` : '–';
      }
      if (c.kind === 'days' && v != null && inv) {
        const stt = String(r.cover_status || '');
        const col = /excess|no movement/i.test(stt) ? '#e07a12' : /stockout|critical/i.test(stt) ? '#d03b3b' : /low/i.test(stt) ? '#d97706' : '#128a3e';
        return `<span class="inv-days" style="color:${col}">${esc(tableFmt(v, c.kind))}</span>`;
      }
      if (c.kind === 'days' && v != null) { const col = v < 7 ? '--critical' : v < 14 ? '--serious' : v < 30 ? '--warning' : v > 180 ? '--series-7' : '--good';
        return `<span class="dchip" style="--c:${css(col)}">${esc(tableFmt(v, c.kind))}</span>`; }
      if (c.field === 'item_class' && CLASS[v]) return `<span class="cls" style="--c:${inv && INV_CLASS[v] ? INV_CLASS[v] : css(CLASS[v])}">${esc(v)}</span>`;
      if (inv && c.field === 'item_no') return `<span class="inv-sku">${esc(v)}</span>`;
      if (c.field === 'abc' && v) return `<span class="abc abc-${esc(v)}">${esc(v)}</span>`;
      return esc(tableFmt(v, c.kind));
    };
    const bg = (r, c) => { if (!barCols.includes(c.field) || r[c.field] == null) return ''; const p = Math.min(100, 100 * Math.abs(r[c.field]) / maxOf[c.field]);
      return ` style="background:linear-gradient(to left, ${hexA(c.kind === 'money' ? css('--accent') : css('--series-3'), .13)} ${p}%, transparent ${p}%)"`; };
    const seq = [];
    const pushN = n => { if (n >= 0 && n < pages && !seq.includes(n)) seq.push(n); };
    pushN(0); for (let i = st.page - 2; i <= st.page + 2; i++) pushN(i); pushN(pages - 1);
    let prevN = -1; const pgBtns = [];
    seq.forEach(n => { if (prevN >= 0 && n - prevN > 1) pgBtns.push('<span class="ellipsis">…</span>'); pgBtns.push(`<button type="button" class="pg${n === st.page ? ' on' : ''}" data-go="${n}">${n + 1}</button>`); prevN = n; });
    const head = inv
      ? `<div class="tablehead inv-tablehead"><h3 style="margin:0">${esc(t.title)} <span class="muted" style="font-weight:400">${t.total_rows.toLocaleString()} rows${t.total_rows > t.rows.length ? `, top ${t.rows.length} shown` : ''}</span></h3>
        <div class="rbtns">${sortToggleHtml(st.dir)}<label class="inv-search">${svg('search', 14)}<input class="tfilter" placeholder="${esc(opts.search || 'Search items…')}"></label>
        <div class="colmenu-wrap"><button type="button" class="btn" data-cols>${svg('sliders', 12)} Columns</button><div class="colmenu${st.colsOpen ? ' open' : ''}">${t.columns.map(c => `<label><input type="checkbox" data-col="${c.field}" ${hidden.has(c.field) ? '' : 'checked'}> ${esc(c.label)}</label>`).join('')}</div></div>
        <button type="button" class="btn" data-csv>${svg('download', 12)} CSV</button></div></div>`
      : `<div class="tablehead"><h3 style="margin:0">${esc(t.title)} <span class="muted" style="font-weight:400">· ${t.total_rows.toLocaleString()} rows${t.total_rows > t.rows.length ? `, top ${t.rows.length} shown` : ''}</span></h3>
      <div class="rbtns">${sortToggleHtml(st.dir)}<input class="tfilter" placeholder="Filter rows…"><button class="btn" data-csv>${svg('download', 12)} CSV</button></div></div>`;
    const pager = inv
      ? `<div class="pager inv-pager"><button type="button" class="btn" data-p="-1" ${st.page === 0 ? 'disabled' : ''}>‹ Prev</button>${pgBtns.join('')}<button type="button" class="btn" data-p="1" ${st.page >= pages - 1 ? 'disabled' : ''}>Next ›</button><label class="rpp">Rows per page <select data-size>${[10, 25, 50].map(n => `<option value="${n}" ${st.size === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>`
      : (pages > 1 ? `<div class="pager"><button class="btn" data-p="-1">‹ Prev</button> Page ${st.page + 1} of ${pages} · ${rows.length.toLocaleString()} rows <button class="btn" data-p="1">Next ›</button></div>` : '');
    el.innerHTML = `${head}<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th class="${num(c.kind) ? 'num' : ''}" data-f="${c.field}"${c.formula ? ` title="${esc(c.formula)}"` : ''}><span>${esc(c.label)}${st.sort === c.field ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</span>${repeated.has(c.field) ? `<select class="colf" data-cf="${esc(c.field)}"><option value="">All</option>${valuesOf(c.field, c.field).map(v => `<option value="${esc(v)}" ${st.colFilter[c.field] === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>` : ''}</th>`).join('')}</tr></thead>
      <tbody>${slice.map(r => `<tr class="${t.drill === 'item_no' && r.item_no ? 'click' : ''}" data-i="${esc(r.item_no || '')}">${cols.map(c => `<td class="${num(c.kind) ? 'num' : ''}"${bg(r, c)} title="${esc(r[c.field])}">${cell(r, c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="muted">No rows match.</td></tr>`}</tbody></table></div>${pager}`;
    el.querySelectorAll('th').forEach(th => th.onclick = ev => { if (ev.target.closest('.colf')) return; const f = th.dataset.f; if (!f) return; st.dir = st.sort === f ? -st.dir : (num(t.columns.find(c => c.field === f).kind) ? -1 : 1); st.sort = f; draw(); });
    el.querySelectorAll('.colf').forEach(sel => { sel.onclick = ev => ev.stopPropagation(); sel.onchange = () => { st.colFilter[sel.dataset.cf] = sel.value; st.page = 0; draw(); }; });
    const sortBtn = el.querySelector('[data-sort-toggle]');
    if (sortBtn) sortBtn.onclick = ev => { ev.stopPropagation(); st.dir = -(st.dir || -1); if (!st.sort && valueCol) st.sort = valueCol.field; st.page = 0; draw(); };
    el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if (b.disabled) return; st.page = Math.max(0, Math.min(pages - 1, st.page + +b.dataset.p)); draw(); });
    el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { st.page = +b.dataset.go; draw(); });
    el.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => openItem(tr.dataset.i));
    el.querySelector('[data-csv]').onclick = () => exportCsv(t);
    const size = el.querySelector('[data-size]'); if (size) size.onchange = () => { st.size = +size.value; st.page = 0; draw(); };
    const colsBtn = el.querySelector('[data-cols]');
    if (colsBtn) colsBtn.onclick = () => { st.colsOpen = !st.colsOpen; draw(); };
    el.querySelectorAll('[data-col]').forEach(cb => cb.onchange = () => {
      if (cb.checked) hidden.delete(cb.dataset.col);
      else if (hidden.size < t.columns.length - 1) hidden.add(cb.dataset.col);
      st.colsOpen = true; draw();
    });
    const tf = el.querySelector('.tfilter'); tf.value = st.q || '';
    if (inv) tf.oninput = () => { const pos = tf.selectionStart; st.q = tf.value; st.page = 0; draw(); const n = el.querySelector('.tfilter'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } };
    else tf.oninput = () => { st.q = tf.value; const q = st.q.toLowerCase(); el.querySelectorAll('tbody tr').forEach(tr => tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? '' : 'none'); };
    if (!inv && st.q) tf.oninput();
  };
  draw();
}

function exportCsv(t) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const body = [t.columns.map(c => q(c.label)).join(','), ...t.rows.map(r => t.columns.map(c => q(r[c.field])).join(','))].join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/csv' }));
  a.download = t.title.replace(/\W+/g, '_') + '.csv'; a.click();
}

      <div class="inv-pad rcards">${d.catalogue.filter(c => c.category === cat).map(c => `<button class="rcard" data-r="${esc(c.id)}" data-find="${esc((c.name + ' ' + c.description).toLowerCase())}"><div class="rc-ic">${svg(CAT_ICON[cat] || 'doc', 18)}</div><div><b>${esc(c.name)}</b><div class="muted">${esc(c.description)}</div></div>${svg('arrow', 14)}</button>`).join('')}</div></section>`).join('')}</div></div>`;
  document.querySelectorAll('.rcard').forEach(b => b.onclick = () => go('report:' + b.dataset.r));
  document.getElementById('askThis').onclick = () => { askOnPage('Which standard reports should I open for stock, cover, overdue purchase orders, and exceptions?'); };
  document.getElementById('toBuilder').onclick = () => go('builder');
  document.getElementById('toSched').onclick = () => go('schedules');
  document.getElementById('repQ').oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#repGroups .rgroup').forEach(group => {
      let shown = 0;
      group.querySelectorAll('.rcard').forEach(card => {
        const on = !q || card.dataset.find.includes(q);
        card.hidden = !on;
        if (on) shown += 1;
      });
      group.hidden = shown === 0;
    });
  };
}

  const meta = S.reportCat.catalogue.find(c => c.id === rid) || { name: rid, description: '' };
  document.getElementById('pageTitle').textContent = `Reporting / ${meta.name}`;
  const f = S.rFilters || (S.rFilters = { item_class: '', site: '', q: '' });
  const c = document.getElementById('content');
  c.innerHTML = `<div class="vhead"><div><h1>${esc(meta.name)}</h1><p>${esc(meta.description)}</p></div>
      <div class="page-tools">${sectionTabs('reports')}<div class="rbtns"><a class="btn primary" id="xl">${svg('download', 14)} Excel</a><a class="btn" id="csv">${svg('download', 14)} CSV</a>
      <button class="btn" id="pdf">${svg('printer', 14)} Print / PDF</button><button class="btn" id="sch">${svg('calendar', 14)} Schedule</button>
      <button class="btn" id="save">${svg('star', 14)} Save to history</button><button class="btn" id="askR">${I.spark.replace('class="spark"', 'width="14" height="14"')} Ask agent</button></div></div></div>
    <div class="filters"><select id="f_class"><option value="">All classes</option>${['RM', 'WIP', 'FG'].map(x => `<option ${f.item_class === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <select id="f_site"><option value="">All sites</option>${S.meta.sites.map(s => `<option ${f.site === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
      <input id="f_q" placeholder="Search item, description, vendor, PO…" value="${esc(f.q)}">
      <div class="seg" id="f_measure"><button type="button" data-m="value" class="${pageMeasure === 'value' ? 'on' : ''}">Value</button><button type="button" data-m="qty" class="${pageMeasure === 'qty' ? 'on' : ''}">Quantity</button></div>
      <button class="btn" id="f_clear">Clear</button></div>
    <div id="schedBox"></div><div id="rbody"><div class="empty"><span class="thinking"><i></i><i></i><i></i></span> Building report…</div></div>`;
  const upd = () => { S.rFilters = { item_class: f_class.value, site: f_site.value, q: f_q.value.trim() }; renderReport(rid); };
  f_class.onchange = upd; f_site.onchange = upd; let t; f_q.oninput = () => { clearTimeout(t); t = setTimeout(upd, 500); };
  f_clear.onclick = () => { S.rFilters = { item_class: '', site: '', q: '' }; pageMeasure = 'value'; renderReport(rid); };
  document.querySelectorAll('#f_measure button').forEach(b => { b.onclick = ev => { ev.stopPropagation(); pageMeasure = b.dataset.m; if (S.reportRaw) drawReportBody(document.getElementById('rbody'), measuredReport(S.reportRaw)); document.querySelectorAll('#f_measure button').forEach(x => x.classList.toggle('on', x.dataset.m === pageMeasure)); }; });
  const qs = qsOf(S.rFilters);
  document.getElementById('xl').href = `/api/reports/export/${encodeURIComponent(rid)}?${qs}&fmt=xlsx`;
  document.getElementById('csv').href = `/api/reports/export/${encodeURIComponent(rid)}?${qs}&fmt=csv`;
  document.getElementById('sch').onclick = () => scheduleForm(document.getElementById('schedBox'), rid, S.rFilters);
  document.getElementById('save').onclick = async e => { const b = e.currentTarget; b.disabled = true; b.textContent = 'Saving…';
    const h = await api('/api/reports/generate/' + encodeURIComponent(rid), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(S.rFilters) });
    b.innerHTML = `${svg('check', 14)} Saved (${h.rows.toLocaleString()} rows)`; };
  document.getElementById('askR').onclick = () => { askOnPage(`Summarise the ${meta.name}${S.rFilters.item_class ? ' for ' + S.rFilters.item_class : ''}${S.rFilters.site ? ' at ' + S.rFilters.site : ''}: key findings and what to act on.`); };
  const r = await api(`/api/reports/run/${encodeURIComponent(rid)}?${qs}`);
  if (S.view !== 'report:' + rid) return;
  S.reportRaw = r;
  document.getElementById('pdf').onclick = () => printReport(measuredReport(S.reportRaw));
  drawReportBody(document.getElementById('rbody'), measuredReport(r));

function measuredReport(r) {
  if (!r || pageMeasure !== 'qty') return r;
  const summary = (r.summary || []).map(k => (k.qty === undefined || k.qty === null) ? k : Object.assign({}, k, { value: k.qty, kind: 'qty' }));
  return Object.assign({}, r, { summary });
}

function drawReportBody(el, r, opts = {}) {
  el.innerHTML = `<div class="print-head"><b>${esc(r.name || 'Report')}</b> · ${esc(r.company || S.meta.notes.company)} · reporting date ${esc(r.reporting_date || S.meta.notes.reporting_date)} · generated ${esc(r.generated_at || '')} EAT${r.params && Object.keys(r.params).length ? ' · ' + esc(Object.entries(r.params).map(([k, v]) => k + '=' + v).join(', ')) : ''}</div>
    ${kpisHTML(r.summary)}${insightsHTML(r.insights)}${chartsHTML(r.charts, 'rch')}
    ${(r.sections || []).map((s, i) => `<div class="card tablecard" id="rsec${i}"></div>`).join('')}`;
  bindKpiLinks(el);
  mountCharts(r.charts, 'rch');
  (r.sections || []).forEach((s, i) => renderTable(document.getElementById('rsec' + i), s, { size: opts.size || 25 }));
}

function printReport(r) {
  drawReportBody(document.getElementById('rbody'), r, { size: 100000 });
  document.body.classList.add('printing');
  setTimeout(() => { window.print(); document.body.classList.remove('printing'); drawReportBody(document.getElementById('rbody'), r); }, 400);
}

function scheduleForm(box, rid, params) {
  const known = knownEmails();
  box.innerHTML = `<div class="card sched-form"><h3>${svg('calendar', 15)} Schedule this report</h3>
    <div class="filters" style="margin:0">
      <select id="s_freq">${Object.entries(FREQ).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      <select id="s_wd" hidden>${DAYS.map((d, i) => `<option value="${i}">${d}</option>`).join('')}</select>
      <select id="s_md" hidden>${Array.from({ length: 28 }, (_, i) => `<option>${i + 1}</option>`).join('')}</select>
      <span id="s_everywrap" hidden><input id="s_every" type="number" min="1" value="1" style="width:72px;min-width:0"> <select id="s_unit"><option value="days">days</option><option value="hours">hours</option></select></span>
      <input type="time" id="s_time" value="07:00" style="min-width:0"> <span class="muted">EAT</span>
      <button class="btn primary" id="s_ok">Create schedule</button><button class="btn" id="s_x">Cancel</button></div>
    <div style="margin-top:10px"><div class="muted" style="margin-bottom:6px">Email the Excel to</div>
      <div class="mail-picks">${known.map(e => `<label><input type="checkbox" class="s_to" value="${esc(e)}" ${e === known[0] ? 'checked' : ''}> ${esc(e)}</label>`).join('') || '<span class="muted">No saved addresses yet.</span>'}
      <input id="s_custom" type="email" placeholder="Add an email" style="min-width:180px"><button type="button" class="btn" id="s_add">Add</button></div></div>
    <div class="muted" id="s_mailnote" style="margin-top:8px">Each run saves an Excel file to Reports → History${Object.values(params || {}).some(Boolean) ? ' with the current filters' : ''}.</div></div>`;
  const fr = box.querySelector('#s_freq');
  const syncFreq = () => {
    box.querySelector('#s_wd').hidden = fr.value !== 'weekly';
    box.querySelector('#s_md').hidden = fr.value !== 'monthly';
    box.querySelector('#s_everywrap').hidden = fr.value !== 'custom';
  };
  fr.onchange = syncFreq;
  box.querySelector('#s_add').onclick = () => {
    const input = box.querySelector('#s_custom');
    const email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return;
    if ([...box.querySelectorAll('.s_to')].some(x => x.value.toLowerCase() === email.toLowerCase())) { input.value = ''; return; }
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" class="s_to" value="${esc(email)}" checked> ${esc(email)}`;
    box.querySelector('.mail-picks').insertBefore(label, input);
    input.value = '';
  };
  box.querySelector('#s_x').onclick = () => box.innerHTML = '';
  api('/api/mail/status').then(s => {
    const note = box.querySelector('#s_mailnote');
    if (note && !s.configured) note.textContent += ' The mailbox is not connected on this workspace yet, so the file will not be sent.';
  }).catch(() => {});
  box.querySelector('#s_ok').onclick = async () => {
    const recipients = [...box.querySelectorAll('.s_to:checked')].map(x => x.value);
    const s = await api('/api/schedules/report', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      report_id: rid, params: Object.fromEntries(Object.entries(params || {}).filter(([, v]) => v)), frequency: fr.value,
      time: box.querySelector('#s_time').value || '07:00', weekday: box.querySelector('#s_wd').value, monthday: box.querySelector('#s_md').value,
      every: box.querySelector('#s_every').value, unit: box.querySelector('#s_unit').value, recipients }) });
    if (s.error) { box.querySelector('#s_mailnote').textContent = s.error; return; }
    const mailed = recipients.length ? (s.mail_configured ? ` It will be emailed to ${recipients.join(', ')}.` : ` Saved for ${recipients.join(', ')}. The mailbox is not connected yet, so it will not be sent.`) : ' No email address was selected.';
    box.innerHTML = `<div class="card">${svg('check', 15)} Scheduled — next run ${esc((s.next_run || '').replace('T', ' ').slice(0, 16))} EAT.${esc(mailed)} <a href="#schedules">Manage schedules</a></div>`;
  };
}

      <div class="inv-kpi-row"><p class="inv-kpi-v">${k.value}</p>${cipSpark(null, face.fg, k.label)}</div></article>`;
  }).join('');
  const opt = (list, sel, blank) => (blank ? `<option value="">${blank}</option>` : '') + list.map(c => `<option value="${c.field}" ${c.field === sel ? 'selected' : ''}>${esc(c.label)}</option>`).join('');
  document.getElementById('content').innerHTML = `<div class="inv-page">
    <div class="inv-head">${sectionTabs('builder')}<div class="inv-actions"><button class="btn" id="askThis">${svg('sparkle', 14)} Ask about this view</button></div></div>

      ${b.mode === 'list' ? `<label>Columns</label><div class="colpick">${cols.map(c => `<label class="chk"><input type="checkbox" value="${c.field}" ${b.columns.includes(c.field) ? 'checked' : ''}> ${esc(c.label)}</label>`).join('')}</div>`

           <label>Measures</label>${b.metrics.map((m_, i) => `<div class="row2"><select data-mi="${i}" class="b_mcol">${opt(num, m_.col, 'Column…')}</select><select data-mi="${i}" class="b_magg">${Object.entries(AG).map(([k, v]) => `<option value="${k}" ${k === m_.agg ? 'selected' : ''}>${v}</option>`).join('')}</select><button class="btn" data-mrm="${i}">${svg('x', 12)}</button></div>`).join('')}

        <select data-ci="${i}" class="b_cop">${['=', '!=', '>', '>=', '<', '<=', 'contains'].map(o => `<option ${o === cd.op ? 'selected' : ''}>${o}</option>`).join('')}</select>

        <label>Site<select id="b_site"><option value="">All</option>${S.meta.sites.map(s => `<option ${b.filters.site === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label></div>
      <div class="row2"><label>Sort by<select id="b_sort">${opt(cols, b.sort.col, 'Default')}</select></label><label>Order<select id="b_dir"><option value="desc">High → low</option><option value="asc" ${b.sort.dir === 'asc' ? 'selected' : ''}>Low → high</option></select></label></div>
      <label>Max rows<input id="b_lim" type="number" min="1" value="${esc(b.limit)}" placeholder="All"></label>

    b_msg.textContent = '';

    const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = D[b.dataset].label.replace(/\W+/g, '_') + '.xlsx'; a.click(); };
  b_save.onclick = async () => { read(); const name = prompt('Name for this report', S.builder.savedName || ''); if (!name) return;

  if (b.ran) run();

}

/* ----- schedules & history ----- */
async function renderSchedules() {
  const [s, h, cat] = await Promise.all([api('/api/schedules'), api('/api/reports/history'), api('/api/reports')]);
  if (S.view !== 'schedules') return;
  S.reportCat = cat;
  const when = x => x.frequency === 'custom' ? `Every ${x.every || 1} ${x.unit || 'days'}` : x.frequency === 'weekly' ? `Weekly on ${DAYS[x.weekday]}` : x.frequency === 'monthly' ? `Monthly on day ${x.monthday}` : FREQ[x.frequency];
  const total = s.reports.length, active = s.reports.filter(x => x.enabled).length, paused = total - active;
  const share = n => total ? Math.round(100 * n / total) : null;
  const faces = {
    'Schedules': { icon: 'calendar', bg: '#e8f1ff', fg: '#2563EB' },
    'Active': { icon: 'play', bg: '#e8f8ef', fg: '#16a34a' },
    'Paused': { icon: 'clock', bg: '#fff4e8', fg: '#e07a12' },
    'History': { icon: 'doc', bg: '#eef2ff', fg: '#4f46e5' },
  };
  const cards = [
    { label: 'Schedules', value: `${esc(String(fmt(total, 'qty')))}<small> schedules</small>` },
    { label: 'Active', value: `${esc(String(fmt(active, 'qty')))}<small> schedules</small>`, pct: share(active) },
    { label: 'Paused', value: `${esc(String(fmt(paused, 'qty')))}<small> schedules</small>`, pct: share(paused) },
    { label: 'History', value: `${esc(String(fmt(h.length, 'qty')))}<small> runs</small>` },
  ];
  const kpis = cards.map(k => {
