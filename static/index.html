<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Command Center</title>
<link rel="icon" type="image/png" href="/static/pulse-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@2.3.1/dist/chartjs-chart-treemap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@0.12.1/dist/chartjs-chart-sankey.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f6fa; --surface-1: #ffffff; --surface-2: #f6f8fb; --surface-3: #eef2f8; --border: #e6e9ef; --border-strong: #d9dee7;
  --text-primary: #0f1b33; --text-secondary: #5b6478; --text-muted: #8a93a6;
  --accent: #1f6bff; --accent-hover: #1658d6; --accent-soft: #eaf1ff; --grid: #eef0f4;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --serif: "Source Serif 4", Georgia, serif;
  --shadow: 0 10px 30px -12px rgba(31, 54, 99, .18), 0 2px 6px rgba(31, 54, 99, .05);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text-primary); font: 14px/1.45 Inter, system-ui, sans-serif; }
button { font: inherit; }
.app { display: grid; grid-template-columns: auto 1fr; min-height: 100vh; }

/* ---------- side rail ---------- */
.rail { width: 260px; background: var(--surface-1); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; transition: width .18s; overflow: hidden; }
.rail.collapsed { width: 64px; }
.rail .logo { display: flex; align-items: center; gap: 10px; padding: 14px 14px 6px; }
.logo-img { width: 40px; height: 40px; flex: none; object-fit: contain; background: transparent; border: 0; padding: 0; }
.rail.collapsed .logo { padding-left: 10px; }
.logo-mark { width: 36px; height: 36px; flex: none; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 700; font-family: var(--serif); font-size: 20px;
  background: linear-gradient(135deg, #1f6bff, #4aa3ff); box-shadow: 0 4px 10px -3px rgba(31,107,255,.5); }
.logo-text { font-weight: 700; letter-spacing: .3px; white-space: nowrap; }
.logo-text small { display: block; font-weight: 500; font-size: 11px; color: var(--text-muted); letter-spacing: 0; }
.rail .toggle { margin: 4px 14px 8px; width: 36px; height: 28px; border: 0; background: none; color: var(--text-muted); border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
.rail .toggle:hover { background: var(--surface-3); }
.rail .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 10px 10px; }
.rail .sep { height: 1px; background: var(--border); margin: 10px 4px; }
.rail .group { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 8px 8px 4px; white-space: nowrap; }
.rail.collapsed .group, .rail.collapsed .lbl, .rail.collapsed .logo-text { display: none; }
.rail a { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 8px; color: var(--text-secondary); text-decoration: none; cursor: pointer; font-size: 13px; white-space: nowrap; }
.rail a svg { flex: none; width: 18px; height: 18px; }
.rail a .no { flex: none; width: 18px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.rail a:hover { background: var(--surface-2); color: var(--text-primary); }
.rail a .lbl { overflow: hidden; text-overflow: ellipsis; }
.rail a.active { background: var(--accent-soft); color: var(--accent); }
.rail a.active .no { color: var(--accent); }
.rail .foot { padding: 12px 14px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #5b7cfa; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.avatar.ghost { background: var(--surface-3); color: var(--text-muted); }

/* ---------- top bar ---------- */
.shell { min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 62px; background: var(--surface-1); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; gap: 12px; position: sticky; top: 0; z-index: 5; }
.topbar .page { font-weight: 600; font-size: 14.5px; }
.topbar .right { display: flex; align-items: center; gap: 14px; }
.topbar .when { text-align: right; line-height: 1.25; }
.topbar .when b { display: block; font-size: 14px; }
.topbar .when a { font-size: 12px; color: var(--text-secondary); text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; cursor: pointer; }
.topbar .when a:hover { color: var(--accent); }
main { padding: 16px 24px 48px; flex: 1; min-width: 0; }

/* ---------- command center home ---------- */
.hero { background: linear-gradient(180deg, #fbfcfe 0%, #f5f7fc 70%, #eef0fb 100%); border-radius: 14px; padding: 64px 24px 48px; min-height: calc(100vh - 110px); display: flex; flex-direction: column; align-items: center; }
.hero h1 { font-family: var(--serif); font-weight: 700; font-size: 40px; letter-spacing: -.5px; margin: 0; text-align: center; }
.hero h1 span { color: var(--accent); }
.hero .sub { font-family: var(--serif); color: var(--text-secondary); font-size: 17.5px; max-width: 520px; text-align: center; margin: 14px 0 0; }
.hero.chatting { padding-top: 24px; }
.hero.chatting h1 { font-size: 26px; }
.hero.chatting .sub { display: none; }
.askbox { width: min(768px, 100%); margin-top: 52px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 28px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px; }
.hero.chatting .askbox { margin-top: 16px; position: sticky; bottom: 16px; }
.askbox svg.spark { width: 22px; height: 22px; color: var(--accent); flex: none; }
.askbox input { flex: 1; border: 0; outline: 0; background: none; font: inherit; font-size: 15px; color: var(--text-primary); padding: 12px 0; min-width: 0; }
.askbox input::placeholder { color: var(--text-muted); }
.askbox .send { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--surface-3); color: var(--text-muted); cursor: pointer; display: grid; place-items: center; flex: none; transition: background .15s, color .15s; }
.askbox .send.ready { background: var(--accent); color: #fff; }
.divider { width: min(768px, 100%); display: flex; align-items: center; gap: 14px; margin: 56px 0 18px; color: var(--text-muted); font-size: 11.5px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 500; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border-strong); }
.insights { width: min(768px, 100%); display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.insight { display: flex; flex-direction: column; justify-content: flex-start; background: rgba(255,255,255,.75); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; text-align: left; cursor: pointer; color: inherit; transition: box-shadow .15s, border-color .15s, transform .15s; }
.insight:hover { box-shadow: var(--shadow); border-color: var(--border-strong); transform: translateY(-1px); }
.insight .lab { font-size: 11.5px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; font-weight: 500; }
.insight .val { font-family: var(--serif); font-size: 24px; font-weight: 700; margin: 6px 0 2px; }
.insight .txt { font-size: 12.5px; color: var(--text-secondary); }
.insight .go { font-size: 12px; color: var(--accent); margin-top: 8px; font-weight: 500; }
.insight.skeleton { height: 128px; background: linear-gradient(90deg, #f1f3f8, #f8f9fc, #f1f3f8); background-size: 200% 100%; animation: sh 1.4s infinite; cursor: default; }
@keyframes sh { to { background-position: -200% 0; } }
.thread { width: min(860px, 100%); display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
.msg { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; box-shadow: 0 1px 2px rgba(15,27,51,.04); min-width: 0; }
.msg.user { align-self: flex-end; max-width: 75%; background: var(--accent); color: #fff; border-color: var(--accent); border-radius: 18px 18px 4px 18px; padding: 10px 16px; }
.msg .basis { color: var(--text-muted); font-size: 12px; margin-top: 10px; display: flex; align-items: center; gap: 6px; }
.msg p { margin: 6px 0; } .msg ul { margin: 6px 0; padding-left: 20px; }
.msg > div > table { border: 1px solid var(--border); border-radius: 8px; display: block; overflow-x: auto; }
.thinking { display: inline-flex; gap: 4px; } .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .3; animation: bl 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .15s; } .thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes bl { 50% { opacity: 1; } }
.rail .badge { margin-left: auto; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 600; border-radius: 9px; padding: 0 6px; line-height: 17px; min-width: 18px; text-align: center; }
.rail.collapsed a { position: relative; }
.rail.collapsed .badge { position: absolute; top: 2px; left: 26px; }
.rail a .no.lbl { margin-left: auto; width: auto; }
.chips { width: min(768px, 100%); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.chips button { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary); border-radius: 16px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
.chips button:hover { border-color: var(--accent); color: var(--accent); }
.chips svg { color: var(--accent); }
.hero.chatting .chips { margin-top: 10px; }
.steps { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 12.5px; }
.steps summary { cursor: pointer; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; font-weight: 500; }
.steps summary svg { color: var(--good); }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0 2px; }
.step .n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
.acts-head { margin: 12px 0 8px; font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; color: var(--text-secondary); }
.acts, .alist { display: flex; flex-direction: column; gap: 10px; }
.alist { margin-bottom: 12px; }
.action { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.action.approved { border-left: 3px solid var(--good); } .action.dismissed { opacity: .65; } .action.proposed { border-left: 3px solid var(--warning); }
.a-top { display: flex; gap: 12px; align-items: flex-start; }
.a-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); }
.a-ic.k-alert { background: #fff4dc; color: #b77a00; } .a-ic.k-transfer { background: #e3f6ee; color: #11845a; } .a-ic.k-briefing { background: #efeaff; color: #5b47c9; }
.a-main { flex: 1; min-width: 0; } .a-title { font-weight: 600; }
.action details { margin-top: 8px; } .action summary { cursor: pointer; color: var(--accent); font-size: 12.5px; display: inline-flex; gap: 5px; align-items: center; }
.a-prev { margin-top: 8px; } .a-prev pre { white-space: pre-wrap; font: 12.5px/1.5 Inter, sans-serif; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin: 0; max-height: 320px; overflow: auto; }
.a-prev .md { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 4px 14px; max-height: 420px; overflow: auto; font-size: 13px; }
.a-prev .md table { margin: 6px 0; }
.a-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.a-btns .btn, .open-ui { display: inline-flex; gap: 5px; align-items: center; text-decoration: none; }
.open-ui { margin-top: 12px; }
.empty { text-align: center; padding: 36px; background: var(--surface-1); border: 1px dashed var(--border-strong); border-radius: 12px; color: var(--text-secondary); }
.empty svg { color: var(--text-muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 12px; margin-top: 12px; }
.tile { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text-primary); }
.tile svg:first-child { color: var(--accent); } .tile svg:last-child { margin-left: auto; color: var(--text-muted); }
.tile:hover { background: var(--accent-soft); }
.alert-row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.card h3 { display: flex; align-items: center; gap: 6px; }
.rgroup { margin-bottom: 18px; } .rgroup h3 { display: flex; gap: 8px; align-items: center; font-size: 15px; margin: 6px 0 10px; }
.rgroup h3 svg { color: var(--accent); }
.rcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 10px; }
.rcard { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; color: inherit; transition: box-shadow .15s, border-color .15s; }
.rcard:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.rcard > div:nth-child(2) { flex: 1; min-width: 0; } .rcard .muted { font-size: 12px; } .rcard > svg { color: var(--text-muted); flex: none; }
.rc-ic { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.rbtns { display: flex; gap: 8px; flex-wrap: wrap; } .rbtns .btn { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
.sched-form { margin-bottom: 12px; }
.print-head { display: none; }
.builder { display: grid; grid-template-columns: 340px 1fr; gap: 14px; align-items: start; }
.bform { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; }
.bform label { font-size: 12px; color: var(--text-secondary); font-weight: 500; display: flex; flex-direction: column; gap: 4px; }
.bform select, .bform input { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; min-width: 0; }
.bform .chk { flex-direction: row; align-items: center; gap: 6px; font-weight: 400; color: var(--text-primary); }
.colpick { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; align-items: end; } .row2:has(label) { grid-template-columns: 1fr 1fr; }
.row3 { display: grid; grid-template-columns: 1.3fr .7fr 1fr auto; gap: 6px; }
.seg { display: flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--surface-1); padding: 7px; cursor: pointer; color: var(--text-secondary); font-size: 13px; }
.seg button.on { background: var(--accent); color: #fff; }
.bbtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; } .bbtns .btn { display: inline-flex; gap: 5px; align-items: center; }
.chk { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; cursor: pointer; }
.banner { background: var(--surface-1); border: 1px solid var(--border); border-left: 4px solid var(--warning); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
@media (max-width: 900px) { .builder { grid-template-columns: 1fr; } .bform { position: static; max-height: none; } }
@media print {
  .rail, .topbar, .filters, .vhead .rbtns, .vhead button, .inv-actions, #schedBox, .pager, [data-csv], .drawer { display: none !important; }
  body, html { background: #fff; } main { padding: 0; } .app { display: block; }
  .print-head { display: block; font-size: 12px; color: #333; margin-bottom: 10px; }
  .tablewrap { max-height: none !important; overflow: visible !important; border: 0; }
  .card, .kpi { break-inside: avoid; box-shadow: none; } .tablecard { break-inside: auto; }
  td { white-space: normal; max-width: none; } th { position: static; }
  .chartbox { height: 240px; }
}
.note-banner { width: min(768px, 100%); margin-top: 14px; font-size: 12.5px; color: var(--text-secondary); text-align: center; }

/* ---------- dashboards ---------- */
.vhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 4px 0 14px; }
.vhead h1 { font-family: var(--serif); font-size: 28px; margin: 0; letter-spacing: -.3px; }
.vhead h1 .no { color: var(--accent); }
.vhead p { color: var(--text-secondary); margin: 4px 0 0; font-family: var(--serif); font-size: 15.5px; }
.btn { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filters select, .filters input { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; }
.filters input { min-width: 260px; }
.filters input[type=checkbox], .filters input[type=time], .filters input[type=number] { min-width: 0; }
.filters select:focus, .filters input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.kpi .label { color: var(--text-secondary); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.kpi .value { font-family: var(--serif); font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .value small { font-family: Inter, sans-serif; font-size: 12px; color: var(--text-muted); font-weight: 500; }
.kpi .note { color: var(--text-muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.charts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.charts > .card { min-width: 0; } .span-2 { grid-column: span 2; } .span-3 { grid-column: 1 / -1; }
@media (max-width: 1200px) { .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span-3 { grid-column: 1 / -1; } }
@media (max-width: 800px) { .charts { grid-template-columns: 1fr; } .span-2, .span-3 { grid-column: auto; } }
.chart-card { display: flex; flex-direction: column; transition: box-shadow .15s; } .chart-card:hover { box-shadow: var(--shadow); }
.ch-head h3 { margin: 0; } .ch-head p { margin: 3px 0 0; color: var(--text-muted); font-size: 12px; }
.ch-head { margin-bottom: 10px; }
.kpi { position: relative; overflow: hidden; transition: box-shadow .15s, transform .15s; }
.kpi.link { cursor: pointer; } .kpi.link:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.kpi.link .label svg { margin-left: auto; color: var(--text-muted); }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .0; }
.kpi[class*="st-"]::before { opacity: 1; } .kpi.st-critical::before { background: var(--critical); } .kpi.st-serious::before { background: var(--serious); }
.kpi.st-warning::before { background: var(--warning); } .kpi.st-good::before { background: var(--good); }
.kv { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.spark-svg { width: 96px; height: 30px; flex: none; }
.kbar { height: 5px; background: var(--surface-3); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.kbar span { display: block; height: 100%; border-radius: 3px; } .kbar.big { height: 9px; border-radius: 5px; }
.insights-card { margin-top: 14px; background: linear-gradient(135deg, #f3f7ff 0%, #ffffff 60%); border: 1px solid #dbe6ff; border-radius: 12px; padding: 14px 18px; }
.ic-head { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--accent); margin-bottom: 8px; font-size: 13.5px; }
.insights-card ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 8px 22px; }
.insights-card li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; }
.ic-dot { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, white); margin-top: 1px; }

<body>

</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
const S = { meta: null, view: null, filters: { item_class: '', site: '', location: '', q: '' }, charts: [], history: [], thread: [] };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CLASS = { RM: '--series-1', WIP: '--series-2', FG: '--series-3', 'Raw Material': '--series-1', 'Work in Progress': '--series-2', 'Finished Goods': '--series-3' };
const STATUS = [
  [/^(stockout|high|constrained|critical|no open supply|only stale supply|no surplus|failed|review)/i, '--critical'],

const statusColor = s => { for (const [re, c] of STATUS) if (re.test(s || '')) return css(c); return css('--text-muted'); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const I = {
  monitor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="16" height="12" rx="2"/><path d="M7 20h6M10 16v4"/><circle cx="19" cy="6" r="3"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
  side: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>',
  spark: '<svg class="spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M10 3l1.6 4.4L16 9l-4.4 1.6L10 15l-1.6-4.4L4 9l4.4-1.6z"/><path d="M18 13l.8 2.2L21 16l-2.2.8L18 19l-.8-2.2L15 16l2.2-.8zM17 3l.5 1.5L19 5l-1.5.5L17 7l-.5-1.5L15 5l1.5-.5z"/></svg>',
  up: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',

const P = {
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',

  gauge: '<path d="M12 14l4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/><path d="M3 17.5l9 5 9-5" opacity=".5"/>',
  package: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/><path d="M7.5 5.5l9 5"/>',
  truck: '<path d="M3 6h11v10H3z"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  trend: '<path d="M3 7l6 6 4-4 8 8"/><path d="M21 11v6h-6"/>',
  alert: '<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 17.5v.5"/>',
  shuffle: '<path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>',
  factory: '<path d="M3 21V9l6 4V9l6 4V5h6v16z"/><path d="M7 17h2M12 17h2M17 17h1"/>',
  flag: '<path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  monitor: '<rect x="2" y="4" width="16" height="12" rx="2"/><path d="M7 20h6M10 16v4"/><circle cx="19" cy="6" r="3"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  swap: '<path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>',
  doc: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  star: '<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.4 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><path d="M1 14h6M9 8h6M17 16h6"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  trendUp: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  printer: '<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>',
  play: '<path d="M7 4l13 8-13 8z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/>',
  filter: '<path d="M4 5h16l-6.2 7.2V19l-3.6-2v-4.8z"/>',
  sparkle: '<path d="M12 3l1.1 3.4L16.5 7.5 13.1 8.6 12 12l-1.1-3.4L7.5 7.5l3.4-1.1z"/><path d="M18 13l.6 1.8L20.5 15.4 18.6 16 18 17.8 17.4 16 15.5 15.4l1.9-.6z"/>',
};
const svg = (n, s = 18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n] || ''}</svg>`;
const VIEW_ICON = { overview: 'grid', inventory_position: 'box', inventory_by_location: 'pin', rm_consumption_cover: 'gauge', wip_cover: 'layers', fg_cover: 'package',
  in_transit_overdue: 'truck', projection_stockout: 'trend', inventory_risk: 'alert', location_risk: 'shuffle', bom_readiness: 'factory', exceptions: 'flag' };
const GROUPS = [
  ['Inventory', ['inventory_position', 'inventory_by_location', 'rm_consumption_cover', 'wip_cover', 'fg_cover']],
  ['Supply & projection', ['in_transit_overdue', 'projection_stockout']],
  ['Risk & production', ['inventory_risk', 'location_risk', 'bom_readiness', 'exceptions']],
];
const KIND_ICON = { expedite: 'mail', transfer: 'swap', alert: 'bell', briefing: 'doc', report: 'doc' };

function fmt(v, kind) {
  if (v === null || v === undefined || v === '') return '–';
  if (kind === 'money') return Math.abs(v) >= 1e9 ? (v / 1e9).toFixed(2) + ' B' : Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + ' M' : Math.round(v).toLocaleString();
  if (kind === 'days') return Number(v).toLocaleString(undefined, { maximumFractionDigits: 1 });
  if (kind === 'qty') return Number(v).toLocaleString(undefined, { maximumFractionDigits: Math.abs(v) < 1 ? 4 : 2 });
  return v;
}
const tableFmt = (v, kind) => kind === 'money' ? (v == null ? '–' : Math.round(v).toLocaleString()) : fmt(v, kind);
async function api(path, opts) { const r = await fetch(path, opts); return r.json(); }
const initials = n => (n || '').split(/\s+/).filter(Boolean).map(w => w[0]).join('').slice(0, 2).toUpperCase();

async function init() {
  S.meta = await api('/api/meta');
  const rail = document.getElementById('rail'), views = S.meta.views;
  rail.innerHTML = `<div class="logo"><img class="logo-img" src="/static/pulse-logo.png" alt="Pulse"><div class="logo-text">Pulse<small>${esc(S.meta.notes.company)}</small></div></div>
    <button class="toggle" id="railToggle" title="Collapse sidebar">${I.side}</button>
    <div class="scroll">
      <a data-v="command" title="Command Center">${svg('monitor')}<span class="lbl">Command Center</span></a>
      <a data-v="actions" title="Agent actions">${svg('inbox')}<span class="lbl">Agent actions</span><span class="badge" id="badge" hidden></span></a>
      <a data-v="overview" title="Overview">${svg('grid')}<span class="lbl">Overview</span></a>
      ${GROUPS.map(([g, ids]) => `<div class="sep"></div><div class="group">${g}</div>` + ids.map(id => { const v = views.find(x => x.id === id);
        return `<a data-v="${id}" title="${v.no} · ${esc(v.title)}">${svg(VIEW_ICON[id])}<span class="lbl">${esc(v.title)}</span></a>`; }).join('')).join('')}
      <div class="sep"></div><div class="group">Reporting</div>
      <a data-v="reports" title="Report library">${svg('doc')}<span class="lbl">Report library</span></a>
      <a data-v="builder" title="Report builder">${svg('sliders')}<span class="lbl">Report builder</span></a>
      <a data-v="schedules" title="Schedules & history">${svg('calendar')}<span class="lbl">Schedules & history</span></a>
      <a data-v="trends" title="Trends">${svg('trendUp')}<span class="lbl">Trends</span></a>
      <div class="sep"></div><div class="group">Governance</div>
      <a data-v="datarefresh" title="Data refresh">${svg('refresh')}<span class="lbl">Data refresh</span></a>
      <a data-v="audit" title="Audit log">${svg('shield')}<span class="lbl">Audit log</span></a>
      <a data-v="definitions" title="Definitions & data notes">${svg('book')}<span class="lbl">Definitions & data notes</span></a>
    </div>
    <div class="foot"><div class="avatar">${esc(initials(S.meta.user_name) || 'P')}</div><div class="lbl" style="font-size:12px;color:var(--text-secondary);white-space:nowrap">${esc(S.meta.user_name || 'Supply Chain')}<br><span class="muted">${esc(S.meta.notes.environment)}</span></div></div>`;
  rail.onclick = e => { const a = e.target.closest('a'); if (a) go(a.dataset.v); };
  document.getElementById('railToggle').onclick = () => isMobile() ? closeMenu() : rail.classList.toggle('collapsed');
  document.getElementById('menuBtn').onclick = () => { rail.classList.add('open'); document.body.classList.add('menu-open'); };
  document.getElementById('scrim').onclick = closeMenu;
  document.getElementById('topAvatar').textContent = initials(S.meta.user_name) || 'P';
  const mn = document.getElementById('mobileNav');
  mn.innerHTML = '<option value="command">Command Center</option><option value="actions">Agent actions</option><option value="overview">Overview</option>' + views.map(v => `<option value="${v.id}">${v.no} ${esc(v.title)}</option>`).join('') + '<option value="reports">Report library</option><option value="builder">Report builder</option><option value="schedules">Schedules & history</option><option value="trends">Trends</option><option value="datarefresh">Data refresh</option><option value="audit">Audit log</option><option value="definitions">Definitions & data notes</option>';
  mn.onchange = () => go(mn.value);
  renderWhen();
  updateBadge();
  go(location.hash.slice(1) || 'command');
}

async function updateBadge() {
  const acts = await api('/api/actions');
  const n = acts.filter(a => a.status === 'proposed').length, b = document.getElementById('badge');
  b.hidden = !n; b.textContent = n;
}

function renderWhen() {
  const n = S.meta.notes;
  const d = new Date(n.reporting_date + 'T12:00:00');
  const long = d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
  const short = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  const inv = document.body.classList.contains('page-inv');
  const loaded = new Date(n.extracted_at);
  const time = Number.isNaN(loaded.getTime()) ? n.extracted_at.replace('T', ' ').slice(0, 16) : loaded.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  const label = `<span class="d-long">${long}</span><span class="d-short">${short}</span>`;
  const refreshLong = S.meta.refreshing ? 'Refreshing from Business Central…' : S.meta.last_error ? 'Last refresh failed – retry' : 'Refresh from Business Central';
  const invStatus = S.meta.refreshing ? 'Refreshing from Business Central…' : S.meta.last_error ? 'Last refresh failed – retry' : `Last updated: ${esc(time)}`;
  const mark = esc(initials(S.meta.user_name) || 'P');
  document.getElementById('when').innerHTML = inv
    ? `<div class="inv-when"><span class="inv-cal">${svg('calendar', 16)}</span><div class="inv-when-text"><span class="inv-date">${label}</span><a id="refresh" class="inv-updated" title="Click to refresh from Business Central">${invStatus}</a></div><div class="inv-avatar" aria-hidden="true">${mark}</div></div>`
    : `<b>${label}</b><a id="refresh" title="Data loaded ${esc(n.extracted_at.replace('T', ' '))}. Click to refresh from Business Central."><span class="r-long">${refreshLong}</span><span class="r-short">${S.meta.refreshing ? 'Refreshing…' : '↻ Refresh'}</span></a>`;
  document.getElementById('refresh').onclick = async () => {
    if (S.meta.refreshing) return;
    await api('/api/refresh', { method: 'POST' }); S.meta.refreshing = true; renderWhen();
    const t = setInterval(async () => { S.meta = await api('/api/meta'); if (!S.meta.refreshing) { clearInterval(t); renderWhen(); go(S.view, true); } }, 4000);
  };
}

const isMobile = () => matchMedia('(max-width: 900px)').matches;
function closeMenu() { document.getElementById('rail').classList.remove('open'); document.body.classList.remove('menu-open'); }

function go(v, force) {
  if (isMobile()) closeMenu();
  if (v === S.view && !force) return;
  S.view = v;
  document.body.classList.toggle('page-inv', v === 'inventory_position');
  renderWhen();
  if (location.hash.slice(1) !== v) location.hash = v;
  const navKey = v.startsWith('report:') ? 'reports' : v;
  document.querySelectorAll('.rail a').forEach(a => a.classList.toggle('active', a.dataset.v === navKey));
  document.getElementById('mobileNav').value = navKey;
  const meta = S.meta.views.find(x => x.id === v);
  const grp = (GROUPS.find(([, ids]) => ids.includes(v)) || [''])[0];
  document.getElementById('pageTitle').textContent = { command: 'Command Center', definitions: 'Definitions & data notes', actions: 'Agent actions', overview: 'Overview', reports: 'Reporting / Report library', builder: 'Reporting / Report builder', schedules: 'Reporting / Schedules & history', trends: 'Reporting / Trends', datarefresh: 'Governance / Data refresh', audit: 'Governance / Audit log' }[v] || `${grp} / ${meta ? meta.title : ''}`;
  S.charts.forEach(ch => ch.destroy()); S.charts = [];
  if (v === 'command') return renderCommand();
  if (v === 'actions') return renderActions();
  if (v === 'reports') return renderReports();
  if (v.startsWith('report:')) return renderReport(v.slice(7));
  if (v === 'builder') return renderBuilder();
  if (v === 'schedules') return renderSchedules();
  if (v === 'trends') return renderTrends();
  if (v === 'datarefresh') return renderDataRefresh();
  if (v === 'audit') return renderAudit();
  if (v === 'definitions') return renderDefinitions();
  loadView();
}

/* ---------------- Command Center ---------------- */
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

function renderCommand() {
  const name = S.meta.user_name;
  const chatting = S.thread.length > 0;
  document.getElementById('content').innerHTML = `<section class="hero ${chatting ? 'chatting' : ''}" id="hero">
    <h1>${greeting()}${name ? `, <span>${esc(name)}</span>` : ''}</h1>
    <p class="sub">Ask for any stock, cover, purchase or production figure — or tell the agent what to do across raw materials, WIP, finished goods and locations.</p>
    <div class="thread" id="thread"></div>
    <div class="askbox">${I.spark}<input id="q" placeholder="Ask anything or tell me what to do..." autocomplete="off"><button class="send" id="send" title="Ask">${I.up}</button></div>
    <div class="chips" id="chips">${S.meta.playbooks.map(p => `<button data-p="${p.id}">${svg(p.icon, 15)}${esc(p.label)}</button>`).join('')}</div>
    ${S.meta.command_mode === 'offline' ? `<div class="note-banner">Offline mode — questions map to the matching view and agent playbook. Configure Azure OpenAI for free-form planning.</div>` : ''}
    <div id="insightsWrap" style="width:100%;display:${chatting ? 'none' : 'flex'};flex-direction:column;align-items:center">
      <div class="divider">AI insights from your data</div>
      <div class="insights" id="insights">${'<div class="insight skeleton"></div>'.repeat(3)}</div>
    </div></section>`;
  const thread = document.getElementById('thread');
  S.thread.forEach(el => thread.appendChild(el));
  const q = document.getElementById('q'), send = document.getElementById('send');
  q.oninput = () => send.classList.toggle('ready', !!q.value.trim());
  send.onclick = () => ask(q.value.trim());
  q.onkeydown = e => { if (e.key === 'Enter') ask(q.value.trim()); };
  document.getElementById('chips').onclick = e => { const b = e.target.closest('button'); if (b) ask(b.textContent.trim(), b.dataset.p); };
  if (!chatting) loadInsights(); else q.focus();
}

async function loadInsights() {
  const cards = await api('/api/insights');
  const box = document.getElementById('insights'); if (!box) return;
  box.innerHTML = cards.map((c, i) => `<button class="insight" data-i="${i}"><div class="lab"><span class="dot" style="background:${css('--' + c.tone)}"></span>${esc(c.label)}</div>
    <div class="val">${esc(c.value)}</div><div class="txt">${esc(c.text)}</div><div class="go">Ask about this →</div></button>`).join('');
  box.onclick = e => { const b = e.target.closest('.insight'); if (b) ask(cards[+b.dataset.i].question); };
}

async function ask(text, playbook) {
  if (!text) return;
  const hero = document.getElementById('hero'), thread = document.getElementById('thread'), q = document.getElementById('q');
  hero.classList.add('chatting'); document.getElementById('insightsWrap').style.display = 'none';
  q.value = ''; document.getElementById('send').classList.remove('ready');
  const u = document.createElement('div'); u.className = 'msg user'; u.textContent = text;
  const a = document.createElement('div'); a.className = 'msg';
  a.innerHTML = `<div class="steps live"><div class="step"><span class="thinking"><i></i><i></i><i></i></span> ${playbook ? 'Agent is planning and working…' : 'Planning and querying the supply chain model…'}</div></div>`;
  thread.append(u, a); S.thread.push(u, a);
  a.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const r = playbook
    ? await api('/api/playbook/' + playbook, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })

const INV_CLASS = {
  RM: '#3b82f6', WIP: '#7c5cf0', FG: '#16a34a',
  'Raw Material': '#3b82f6', 'Work in Progress': '#7c5cf0', 'Finished Goods': '#16a34a',
};
function cipSpark(vals, color, label) {
  const v = (vals || []).filter(x => x != null);
  const w = 112, h = 36, pad = 3;
  if (v.length < 2) {
    const y = (h / 2).toFixed(1);
    return `<svg class="inv-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}: no history" title="No historical series"><line x1="${pad}" y1="${y}" x2="${w - pad}" y2="${y}" stroke="${color}" stroke-width="1.75" stroke-linecap="round"/></svg>`;
  }
  const mn = Math.min(...v), mx = Math.max(...v), rg = (mx - mn) || 1;
  const pts = v.map((x, i) => [pad + (i / (v.length - 1)) * (w - pad * 2), h - pad - ((x - mn) / rg) * (h - pad * 2)]);
  let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    const prev = pts[i - 1], p = pts[i], cx = prev[0] + (p[0] - prev[0]) * 0.5;
    d += ` C ${cx.toFixed(1)} ${prev[1].toFixed(1)}, ${cx.toFixed(1)} ${p[1].toFixed(1)}, ${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  }
  const first = pts[0], last = pts[pts.length - 1];
  const area = `${d} L ${last[0].toFixed(1)} ${h - pad} L ${first[0].toFixed(1)} ${h - pad} Z`;
  const gid = `spk${Math.round(last[0])}${Math.round(last[1])}`;
  return `<svg class="inv-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(label)} weekly receipts" title="Weekly receipts"><defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".2"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.2" fill="${color}" stroke="#fff" stroke-width="1.2"/></svg>`;
}
function invRing(pct, color) {
  if (pct == null || pct === '') return '';
  const p = Math.max(0, Math.min(100, Number(pct)));
  const circ = 2 * Math.PI * 15;
  const dash = (p / 100) * circ;
  return `<svg class="inv-ring" viewBox="0 0 42 42" aria-label="${Math.round(p)} percent of value"><circle cx="21" cy="21" r="15" fill="none" stroke="#eef2f6" stroke-width="3.5"/><circle cx="21" cy="21" r="15" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${dash.toFixed(2)} ${circ.toFixed(2)}" transform="rotate(-90 21 21)"/><text x="21" y="22.6" text-anchor="middle" fill="#14213D" font-size="9" font-weight="700" font-family="Inter,system-ui,sans-serif">${Math.round(p)}%</text></svg>`;
}
function moneyRich(v) {
  if (v == null || v === '') return '–';
  const a = Math.abs(v);
  if (a >= 1e9) return `${(v / 1e9).toFixed(2)}<small> B</small> <span class="u">UGX</span>`;
  if (a >= 1e6) return `${(v / 1e6).toFixed(1)}<small> M</small> <span class="u">UGX</span>`;
  return `${Math.round(v).toLocaleString()} <span class="u">UGX</span>`;
}
const POST_PALETTE = ['#3b82f6', '#34d399', '#8b7cf6', '#fb923c', '#60a5fa', '#2dd4bf', '#a78bfa', '#38bdf8'];

function postingRows(items) {
  const ranked = (items || []).filter(x => x && x.value > 0).slice().sort((a, b) => b.value - a.value);
  if (ranked.length <= 8) return { rows: ranked, hidden: 0, totalGroups: ranked.length };
  const rest = ranked.slice(8);
  const others = rest.reduce((s, x) => s + (Number(x.value) || 0), 0);

function postColor(row, i) { return row.label === 'Others' ? '#94a3b8' : POST_PALETTE[i % POST_PALETTE.length]; }
function drawPosting(host, items, mode) {

    }).join('')}</div>`;

  }
  if (mode === 'treemap') {

    });
  }
  const max = Math.max(...rows.map(r => Number(r.value) || 0), 1);
  const axisTop = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); const n = max / p; const s = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10; return s * p; })();
  const ticks = [0, .25, .5, .75, 1].map(t => fmt(axisTop * t, 'money'));
  host.innerHTML = `<div class="post-bars">${rows.map((r, i) => {

  }).join('')}<div class="post-axis"><span></span><span class="post-ticks">${ticks.map(t => `<span>${t}</span>`).join('')}</span><span></span></div></div>`;
  return null;
}

async function mountInventoryTrend() {
  const el = document.getElementById('chTrend');
  if (!el) return;
  let rows = [];
  try { rows = (await api('/api/trends')).kpi || []; } catch (e) { rows = []; }
  if (!document.getElementById('chTrend')) return;
  const draw = () => {
    const canvas = document.getElementById('chTrend');
    if (!canvas) return;
    const sorted = rows.slice().sort((a, b) => String(a.extracted_at).localeCompare(String(b.extracted_at)));
    const end = sorted.length ? new Date(sorted[sorted.length - 1].extracted_at) : new Date();
    const start = new Date(end); start.setMonth(start.getMonth() - invTrendMonths);
    const picked = sorted.filter(r => new Date(r.extracted_at) >= start);
    const use = picked.length ? picked : sorted;
    const val = r => invTrendMetric === 'rm' ? r.rm_value : invTrendMetric === 'wip' ? r.wip_value : invTrendMetric === 'fg' ? r.fg_value : (Number(r.rm_value) || 0) + (Number(r.wip_value) || 0) + (Number(r.fg_value) || 0);
    const labels = use.map(r => new Date(r.extracted_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
    const data = use.map(val);
    const nums = data.map(Number);
    const hi = nums.length ? Math.max(...nums) : 0, lo = nums.length ? Math.min(...nums) : 0;
    const tight = nums.length > 0 && hi > 0 && (hi - lo) / hi < 0.02;
    S.charts = S.charts.filter(ch => { if (ch && ch.canvas === canvas) { ch.destroy(); return false; } return true; });
    if (!data.length) { canvas.parentElement.innerHTML = '<div class="muted">No stock-value loads recorded yet.</div>'; return; }
    const chart = drawChart(canvas, { type: 'line', unit: 'UGX', labels, quiet: true, glassy: true, hideLegend: true, tight, tightMin: tight ? hi * 0.985 : undefined, tightMax: tight ? hi * 1.015 : undefined, series: [{ name: 'Inventory value', key: 'seq', data }], palette: INV_PALETTE });
    if (chart) S.charts.push(chart);
  };
  const metric = document.getElementById('trendMetric');
  if (metric) { metric.value = invTrendMetric; metric.onchange = () => { invTrendMetric = metric.value; draw(); }; }
  document.querySelectorAll('#trendRange button').forEach(b => { b.classList.toggle('on', +b.dataset.m === invTrendMonths); b.onclick = () => { invTrendMonths = +b.dataset.m; draw(); }; });
  draw();
}

/* ---------- building blocks ---------- */
const TONE = { critical: '--critical', crit: '--critical', serious: '--serious', warning: '--warning', good: '--good', info: '--accent' };
const TONE_ICON = { critical: 'alert', crit: 'alert', serious: 'alert', warning: 'alert', good: 'check', info: 'star' };

function sparkSVG(vals, color) {
  const v = (vals || []).filter(x => x != null);
  if (v.length < 2) return '';
  const w = 120, h = 30, mn = Math.min(...v), mx = Math.max(...v), rg = (mx - mn) || 1;
  const pts = v.map((x, i) => [i * w / (v.length - 1), h - 3 - (x - mn) / rg * (h - 6)]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  return `<svg class="spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="0,${h} ${line} ${w},${h}" fill="${color}" opacity=".12"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="2.6" fill="${color}"/></svg>`;
}

function kpisHTML(kpis) {

      <div class="kv"><div class="value">${k.kind === 'text' ? esc(k.value) : fmt(k.value, k.kind)}${k.kind === 'text' ? '' : unit(k)}</div>${k.spark ? sparkSVG(k.spark, col) : ''}</div>

      ${k.note ? `<div class="note">${esc(k.note)}</div>` : ''}</div>`; }).join('')}</div>`;
}

/* ---------- colours ---------- */
const KEYS = { seq: '--series-1', crit: '--critical', serious: '--serious', warning: '--warning', good: '--good', violet: '--series-7', muted: '--text-muted', FGk: '--series-3' };
const tok = k => CLASS[k] ? css(CLASS[k]) : KEYS[k] ? css(KEYS[k]) : css('--series-1');
const catCol = i => css('--series-' + ((i % 8) + 1));
function hexA(hex, a) { const h = hex.replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function hexRgb(hex) { const h = String(hex).replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixWhite(hex, t) { const [r, g, b] = hexRgb(hex); const m = c => Math.round(c + (255 - c) * t); return `rgb(${m(r)},${m(g)},${m(b)})`; }
function shadeHex(hex, t) { const [r, g, b] = hexRgb(hex); return `rgb(${Math.round(r * t)},${Math.round(g * t)},${Math.round(b * t)})`; }
function glassCss(hex) { return `linear-gradient(90deg, ${mixWhite(hex, .52)} 0%, ${hex} 42%, ${hex} 100%)`; }
function glassFill(ctx, color, kind) {
  const chart = ctx.chart, area = chart && chart.chartArea;
  const c = Array.isArray(color) ? color[ctx.dataIndex] : color;
  if (!c || typeof c !== 'string' || c[0] !== '#') return c || color;
  const x = chart.ctx, el = ctx.element;
  if (kind === 'line') {
    if (!area) return hexA(c, .2);
    const g = x.createLinearGradient(0, area.top, 0, area.bottom);
    g.addColorStop(0, hexA(c, .45)); g.addColorStop(.55, hexA(c, .14)); g.addColorStop(1, hexA(c, 0));
    return g;
  }
  if (kind === 'doughnut') {
    if (!area) return c;
    const cx = (area.left + area.right) / 2, cy = (area.top + area.bottom) / 2;
    const rad = Math.max(area.right - area.left, area.bottom - area.top) / 2;
    const g = x.createRadialGradient(cx - rad * .22, cy - rad * .3, rad * .08, cx, cy, rad);
    g.addColorStop(0, mixWhite(c, .5)); g.addColorStop(.4, c); g.addColorStop(1, shadeHex(c, .9));
    return g;
  }
  const horizontal = kind === 'hbar' || (el && el.horizontal);
  if (el && el.base != null && el.x != null) {
    if (horizontal) {
      const x0 = Math.min(el.x, el.base), x1 = Math.max(el.x, el.base);
      if (x1 - x0 < 1) return c;
      const g = x.createLinearGradient(x0, 0, x1, 0);
      g.addColorStop(0, mixWhite(c, .52)); g.addColorStop(.4, c); g.addColorStop(1, c);
      return g;
    }
    const y0 = Math.min(el.y, el.base), y1 = Math.max(el.y, el.base);
    if (y1 - y0 < 1) return c;
    const g = x.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, mixWhite(c, .5)); g.addColorStop(.22, c); g.addColorStop(1, c);
    return g;
  }
  if (!area) return c;
  const g = x.createLinearGradient(0, area.top, 0, area.bottom);
  g.addColorStop(0, mixWhite(c, .5)); g.addColorStop(1, c);
  return g;
}
const classPaint = (ch, k, fallback) => (ch && ch.palette && ch.palette[k]) || (ch && ch.classColors && ch.classColors[k]) || fallback;
function seriesColor(s, i, labels, ch) {
  if (ch && ch.palette) {
    const p = ch.palette;
    if (s.key && s.key.startsWith('class:')) return s.key.slice(6).split(',').map(k => p[k] || '#94a3b8');
    if (s.key === 'class') return labels.map(l => p[l] || '#94a3b8');
    if (p[s.key]) return p[s.key];
  }
  if (ch && ch.colors && ch.series.length === 1) return ch.colors.map(c => (typeof c === 'string' && c[0] === '#') ? c : tok(c));
  if (s.key && s.key.startsWith('class:')) return s.key.slice(6).split(',').map(k => classPaint(ch, k, css(CLASS[k] || '--series-4')));
  if (s.key === 'class') return labels.map(l => classPaint(ch, l, css(CLASS[l] || '--series-4')));
  if (s.key === 'cat' && ch && ch.type === 'doughnut') return labels.map((_, j) => catCol(j));
  if (s.key === 'cat') return catCol(i);
  if (CLASS[s.key] || KEYS[s.key]) return tok(s.key);
  return catCol(i);
}

/* reference lines + centre text */
const refLines = { id: 'refLines', afterDatasetsDraw(c, _, o) {
  if (!o || !o.y || !o.y.length || !c.scales.y) return; const { ctx, chartArea: a } = c; ctx.save();
  o.y.forEach(v => { const y = c.scales.y.getPixelForValue(v); if (y < a.top || y > a.bottom) return;
    ctx.strokeStyle = v === 0 ? css('--text-muted') : hexA(css('--critical'), .55); ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a.left, y); ctx.lineTo(a.right, y); ctx.stroke();
    if (v) { ctx.fillStyle = css('--text-muted'); ctx.font = '10px Inter'; ctx.fillText(`${v} days`, a.right - 40, y - 3); } });
  ctx.restore(); } };
const centerText = { id: 'centerText', afterDraw(c, _, o) {
  if (!o || o.text == null) return; const { ctx, chartArea: a } = c; ctx.save();

/* ---------- tables with in-cell data bars ---------- */
function renderTable(el, t, opts = {}) {
  const inv = opts.variant === 'inventory';
  const st = { sort: null, dir: 1, page: 0, size: opts.size || (inv ? 10 : 50), q: '', colsOpen: false };
  const hidden = new Set();
  const num = k => ['qty', 'money', 'days'].includes(k);
  const barCols = (inv || t.bars === false) ? [] : t.columns.filter(c => c.kind === 'money' || (c.kind === 'qty' && !/days|line|parent|component/i.test(c.label))).map(c => c.field);
  const maxOf = {}; barCols.forEach(f => maxOf[f] = Math.max(1e-9, ...t.rows.map(r => Math.abs(r[f] || 0))));
  const toneOf = v => /healthy|ready|on time|made to order/i.test(v || '') ? 'good' : /excess|no movement|^low$/i.test(v || '') ? 'warn' : /stockout|critical|high/i.test(v || '') ? 'bad' : '';
  const draw = () => {
    let rows = t.rows.slice();
    const cols = t.columns.filter(c => !inv || !hidden.has(c.field));
    if (st.sort) { const f = st.sort; rows.sort((a, b) => { const x = a[f], y = b[f]; if (x == null) return 1; if (y == null) return -1; return (x > y ? 1 : x < y ? -1 : 0) * st.dir; }); }
    if (inv && st.q) { const q = st.q.toLowerCase(); rows = rows.filter(r => t.columns.some(c => String(r[c.field] ?? '').toLowerCase().includes(q))); }
    const pages = Math.max(1, Math.ceil(rows.length / st.size)); st.page = Math.min(st.page, pages - 1);
    const slice = rows.slice(st.page * st.size, (st.page + 1) * st.size);
    const cell = (r, c) => {
      const v = r[c.field];
      if (c.kind === 'link') return v ? `<a class="btn" href="${esc(v)}">${svg('download', 12)} Excel</a>` : '';
      if (c.kind === 'status') {
        const tone = inv ? toneOf(v) : '';
        return v ? `<span class="pill${tone ? ' tone-' + tone : ''}"><span class="dot" style="background:${statusColor(v)}"></span>${esc(v)}</span>` : '–';
      }
      if (c.kind === 'days' && v != null && inv) {
        const stt = String(r.cover_status || '');
        const col = /excess|no movement/i.test(stt) ? '#e07a12' : /stockout|critical/i.test(stt) ? '#d03b3b' : /low/i.test(stt) ? '#d97706' : '#128a3e';
        return `<span class="inv-days" style="color:${col}">${esc(tableFmt(v, c.kind))}</span>`;
      }
      if (c.kind === 'days' && v != null) { const col = v < 7 ? '--critical' : v < 14 ? '--serious' : v < 30 ? '--warning' : v > 180 ? '--series-7' : '--good';
        return `<span class="dchip" style="--c:${css(col)}">${esc(tableFmt(v, c.kind))}</span>`; }
      if (c.field === 'item_class' && CLASS[v]) return `<span class="cls" style="--c:${inv && INV_CLASS[v] ? INV_CLASS[v] : css(CLASS[v])}">${esc(v)}</span>`;
      if (inv && c.field === 'item_no') return `<span class="inv-sku">${esc(v)}</span>`;
      if (c.field === 'abc' && v) return `<span class="abc abc-${esc(v)}">${esc(v)}</span>`;
      return esc(tableFmt(v, c.kind));
    };
    const bg = (r, c) => { if (!barCols.includes(c.field) || r[c.field] == null) return ''; const p = Math.min(100, 100 * Math.abs(r[c.field]) / maxOf[c.field]);
      return ` style="background:linear-gradient(to left, ${hexA(c.kind === 'money' ? css('--accent') : css('--series-3'), .13)} ${p}%, transparent ${p}%)"`; };
    const seq = [];
    const pushN = n => { if (n >= 0 && n < pages && !seq.includes(n)) seq.push(n); };
    pushN(0); for (let i = st.page - 2; i <= st.page + 2; i++) pushN(i); pushN(pages - 1);
    let prevN = -1; const pgBtns = [];
    seq.forEach(n => { if (prevN >= 0 && n - prevN > 1) pgBtns.push('<span class="ellipsis">…</span>'); pgBtns.push(`<button type="button" class="pg${n === st.page ? ' on' : ''}" data-go="${n}">${n + 1}</button>`); prevN = n; });
    const head = inv
      ? `<div class="tablehead inv-tablehead"><h3 style="margin:0">${esc(t.title)} <span class="muted" style="font-weight:400">${t.total_rows.toLocaleString()} rows${t.total_rows > t.rows.length ? `, top ${t.rows.length} shown` : ''}</span></h3>
        <div class="rbtns"><label class="inv-search">${svg('search', 14)}<input class="tfilter" placeholder="Search items…"></label>
        <div class="colmenu-wrap"><button type="button" class="btn" data-cols>${svg('sliders', 12)} Columns</button><div class="colmenu${st.colsOpen ? ' open' : ''}">${t.columns.map(c => `<label><input type="checkbox" data-col="${c.field}" ${hidden.has(c.field) ? '' : 'checked'}> ${esc(c.label)}</label>`).join('')}</div></div>
        <button type="button" class="btn" data-csv>${svg('download', 12)} CSV</button></div></div>`
      : `<div class="tablehead"><h3 style="margin:0">${esc(t.title)} <span class="muted" style="font-weight:400">· ${t.total_rows.toLocaleString()} rows${t.total_rows > t.rows.length ? `, top ${t.rows.length} shown` : ''}</span></h3>
      <div class="rbtns"><input class="tfilter" placeholder="Filter rows…"><button class="btn" data-csv>${svg('download', 12)} CSV</button></div></div>`;
    const pager = inv
      ? `<div class="pager inv-pager"><button type="button" class="btn" data-p="-1" ${st.page === 0 ? 'disabled' : ''}>‹ Prev</button>${pgBtns.join('')}<button type="button" class="btn" data-p="1" ${st.page >= pages - 1 ? 'disabled' : ''}>Next ›</button><label class="rpp">Rows per page <select data-size>${[10, 25, 50].map(n => `<option value="${n}" ${st.size === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>`

    el.innerHTML = `${head}<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th class="${num(c.kind) ? 'num' : ''}" data-f="${c.field}">${esc(c.label)}${st.sort === c.field ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead>
      <tbody>${slice.map(r => `<tr class="${t.drill === 'item_no' && r.item_no ? 'click' : ''}" data-i="${esc(r.item_no || '')}">${cols.map(c => `<td class="${num(c.kind) ? 'num' : ''}"${bg(r, c)} title="${esc(r[c.field])}">${cell(r, c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" class="muted">No rows match.</td></tr>`}</tbody></table></div>${pager}`;
    el.querySelectorAll('th').forEach(th => th.onclick = () => { const f = th.dataset.f; st.dir = st.sort === f ? -st.dir : (num(t.columns.find(c => c.field === f).kind) ? -1 : 1); st.sort = f; draw(); });
    el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if (b.disabled) return; st.page = Math.max(0, Math.min(pages - 1, st.page + +b.dataset.p)); draw(); });
    el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { st.page = +b.dataset.go; draw(); });
    el.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => openItem(tr.dataset.i));
    el.querySelector('[data-csv]').onclick = () => exportCsv(t);
    const size = el.querySelector('[data-size]'); if (size) size.onchange = () => { st.size = +size.value; st.page = 0; draw(); };
    const colsBtn = el.querySelector('[data-cols]');
    if (colsBtn) colsBtn.onclick = () => { st.colsOpen = !st.colsOpen; draw(); };
    el.querySelectorAll('[data-col]').forEach(cb => cb.onchange = () => {
      if (cb.checked) hidden.delete(cb.dataset.col);
      else if (hidden.size < t.columns.length - 1) hidden.add(cb.dataset.col);

    else tf.oninput = () => { st.q = tf.value; const q = st.q.toLowerCase(); el.querySelectorAll('tbody tr').forEach(tr => tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? '' : 'none'); };
    if (!inv && st.q) tf.oninput();
  };
  draw();
}

function exportCsv(t) {

      <div class="d-tiles">${[['Stock on hand', fmt(s.stock_qty, 'qty') + ' ' + (s.uom || '')], ['Stock value', fmt(s.stock_value, 'money') + ' UGX'], ['Usage / day', fmt(s.daily_usage, 'qty')],
        ['Incoming (open PO)', fmt(s.incoming_qty, 'qty')], ['Overdue on PO', fmt(s.overdue_qty, 'qty')], ['Locations', fmt(s.locations, 'qty')]].map(([a, b]) => `<div><span>${a}</span><b>${esc(b)}</b></div>`).join('')}
        ${d.spark && d.spark.some(x => x) ? `<div class="d-spark"><span>Weekly usage</span>${sparkSVG(d.spark, col)}</div>` : ''}</div></div>
    ${insightsHTML(d.insights)}
    ${d.charts.length ? `<div class="d-charts">${d.charts.map((ch, i) => `<div class="card chart-card"><div class="ch-head"><h3>${esc(ch.title)}</h3></div><div class="chartbox" style="height:220px"><canvas id="dch${i}"></canvas></div></div>`).join('')}</div>` : ''}
    ${sections.map(k => d[k].total_rows ? `<div class="card tablecard" id="d_${k}"></div>` : '').join('')}`;
  document.getElementById('dclose').onclick = () => dr.classList.remove('open');
  document.getElementById('dask').onclick = () => { dr.classList.remove('open'); go('command'); setTimeout(() => ask(`What is the position, cover and supply situation for ${no}, and what should we do?`), 50); };
  document.getElementById('dwatch').onclick = async e => { await api('/api/watchlist/' + encodeURIComponent(no), { method: 'POST' });
    e.currentTarget.innerHTML = `${svg('check', 14)} Watching`; };
  drawerCharts.forEach(c => c && c.destroy()); drawerCharts = d.charts.map((ch, i) => drawChart(document.getElementById('dch' + i), ch));
  sections.forEach(k => d[k].total_rows && renderTable(document.getElementById('d_' + k), d[k], { size: 8 }));

async function renderReports() {

    ${cats.map(cat => `<div class="rgroup"><h3>${svg(CAT_ICON[cat] || 'doc', 16)} ${esc(cat)}</h3><div class="rcards">${d.catalogue.filter(c => c.category === cat).map(c => `
      <button class="rcard" data-r="${esc(c.id)}"><div class="rc-ic">${svg(CAT_ICON[cat] || 'doc', 18)}</div><div><b>${esc(c.name)}</b><div class="muted">${esc(c.description)}</div></div>${svg('arrow', 14)}</button>`).join('')}</div></div>`).join('')}`;

async function renderReport(rid) {
  if (!S.reportCat) S.reportCat = await api('/api/reports');
  const meta = S.reportCat.catalogue.find(c => c.id === rid) || { name: rid, description: '' };
  document.getElementById('pageTitle').textContent = `Reporting / ${meta.name}`;
  const f = S.rFilters || (S.rFilters = { item_class: '', site: '', q: '' });
  const c = document.getElementById('content');
  c.innerHTML = `<div class="vhead"><div><h1>${esc(meta.name)}</h1><p>${esc(meta.description)}</p></div>
      <div class="rbtns"><a class="btn primary" id="xl">${svg('download', 14)} Excel</a><a class="btn" id="csv">${svg('download', 14)} CSV</a>
      <button class="btn" id="pdf">${svg('printer', 14)} Print / PDF</button><button class="btn" id="sch">${svg('calendar', 14)} Schedule</button>
      <button class="btn" id="save">${svg('star', 14)} Save to history</button><button class="btn" id="askR">${I.spark.replace('class="spark"', 'width="14" height="14"')} Ask agent</button></div></div>
    <div class="filters"><select id="f_class"><option value="">All classes</option>${['RM', 'WIP', 'FG'].map(x => `<option ${f.item_class === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <select id="f_site"><option value="">All sites</option>${S.meta.sites.map(s => `<option ${f.site === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
      <input id="f_q" placeholder="Search item, description, vendor, PO…" value="${esc(f.q)}"><button class="btn" id="f_clear">Clear</button></div>
    <div id="schedBox"></div><div id="rbody"><div class="empty"><span class="thinking"><i></i><i></i><i></i></span> Building report…</div></div>`;
  const upd = () => { S.rFilters = { item_class: f_class.value, site: f_site.value, q: f_q.value.trim() }; renderReport(rid); };
  f_class.onchange = upd; f_site.onchange = upd; let t; f_q.oninput = () => { clearTimeout(t); t = setTimeout(upd, 500); };
  f_clear.onclick = () => { S.rFilters = { item_class: '', site: '', q: '' }; renderReport(rid); };
  const qs = qsOf(S.rFilters);
  document.getElementById('xl').href = `/api/reports/export/${encodeURIComponent(rid)}?${qs}&fmt=xlsx`;
  document.getElementById('csv').href = `/api/reports/export/${encodeURIComponent(rid)}?${qs}&fmt=csv`;
  document.getElementById('sch').onclick = () => scheduleForm(document.getElementById('schedBox'), rid, S.rFilters);
  document.getElementById('save').onclick = async e => { const b = e.currentTarget; b.disabled = true; b.textContent = 'Saving…';
    const h = await api('/api/reports/generate/' + encodeURIComponent(rid), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(S.rFilters) });
    b.innerHTML = `${svg('check', 14)} Saved (${h.rows.toLocaleString()} rows)`; };
  document.getElementById('askR').onclick = () => { go('command'); setTimeout(() => ask(`Summarise the ${meta.name}${S.rFilters.item_class ? ' for ' + S.rFilters.item_class : ''}${S.rFilters.site ? ' at ' + S.rFilters.site : ''}: key findings and what to act on.`), 50); };
  const r = await api(`/api/reports/run/${encodeURIComponent(rid)}?${qs}`);
  if (S.view !== 'report:' + rid) return;
  document.getElementById('pdf').onclick = () => printReport(r);

}

function drawReportBody(el, r, opts = {}) {
  el.innerHTML = `<div class="print-head"><b>${esc(r.name || 'Report')}</b> · ${esc(r.company || S.meta.notes.company)} · reporting date ${esc(r.reporting_date || S.meta.notes.reporting_date)} · generated ${esc(r.generated_at || '')} EAT${r.params && Object.keys(r.params).length ? ' · ' + esc(Object.entries(r.params).map(([k, v]) => k + '=' + v).join(', ')) : ''}</div>
    ${kpisHTML(r.summary)}${insightsHTML(r.insights)}${chartsHTML(r.charts, 'rch')}
    ${(r.sections || []).map((s, i) => `<div class="card tablecard" id="rsec${i}"></div>`).join('')}`;
  bindKpiLinks(el);
  mountCharts(r.charts, 'rch');
  (r.sections || []).forEach((s, i) => renderTable(document.getElementById('rsec' + i), s, { size: opts.size || 25 }));
}

function printReport(r) {
  drawReportBody(document.getElementById('rbody'), r, { size: 100000 });
  document.body.classList.add('printing');
  setTimeout(() => { window.print(); document.body.classList.remove('printing'); drawReportBody(document.getElementById('rbody'), r); }, 400);
}

/* ----- report builder ----- */
async function renderBuilder() {
  if (!S.reportCat) S.reportCat = await api('/api/reports');
  const D = S.reportCat.datasets, AG = S.reportCat.aggs;
  const b = S.builder || (S.builder = { dataset: 'items', mode: 'list', columns: [], group_by: '', metrics: [{ col: '', agg: 'sum' }], conditions: [], filters: {}, sort: { col: '', dir: 'desc' }, limit: '' });
  const cols = D[b.dataset].columns, num = cols.filter(c => ['qty', 'money', 'days'].includes(c.kind));
  if (!b.columns.length) b.columns = cols.slice(0, 7).map(c => c.field);
  const opt = (list, sel, blank) => (blank ? `<option value="">${blank}</option>` : '') + list.map(c => `<option value="${c.field}" ${c.field === sel ? 'selected' : ''}>${esc(c.label)}</option>`).join('');
  document.getElementById('content').innerHTML = `<div class="vhead"><div><h1>Report builder</h1><p>Pick a dataset, choose columns or group and summarise, add conditions — then export, save or schedule.</p></div></div>
    <div class="builder"><div class="card bform">
      <label>Dataset<select id="b_ds">${Object.entries(D).map(([k, v]) => `<option value="${k}" ${k === b.dataset ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select></label>
      <div class="seg"><button class="${b.mode === 'list' ? 'on' : ''}" data-mode="list">List rows</button><button class="${b.mode === 'group' ? 'on' : ''}" data-mode="group">Group & summarise</button></div>
      ${b.mode === 'list' ? `<label>Columns</label><div class="colpick">${cols.map(c => `<label class="chk"><input type="checkbox" value="${c.field}" ${b.columns.includes(c.field) ? 'checked' : ''}> ${esc(c.label)}</label>`).join('')}</div>`
        : `<label>Group by<select id="b_group">${opt(cols.filter(c => !['qty', 'money', 'days'].includes(c.kind)), b.group_by, 'Choose…')}</select></label>
           <label>Measures</label>${b.metrics.map((m_, i) => `<div class="row2"><select data-mi="${i}" class="b_mcol">${opt(num, m_.col, 'Column…')}</select><select data-mi="${i}" class="b_magg">${Object.entries(AG).map(([k, v]) => `<option value="${k}" ${k === m_.agg ? 'selected' : ''}>${v}</option>`).join('')}</select><button class="btn" data-mrm="${i}">${svg('x', 12)}</button></div>`).join('')}
           <button class="btn" id="b_madd">${svg('plus', 12)} Add measure</button>`}
      <label>Conditions</label>${b.conditions.map((cd, i) => `<div class="row3"><select data-ci="${i}" class="b_ccol">${opt(cols, cd.col, 'Column…')}</select>
        <select data-ci="${i}" class="b_cop">${['=', '!=', '>', '>=', '<', '<=', 'contains'].map(o => `<option ${o === cd.op ? 'selected' : ''}>${o}</option>`).join('')}</select>
        <input data-ci="${i}" class="b_cval" value="${esc(cd.value || '')}" placeholder="value"><button class="btn" data-crm="${i}">${svg('x', 12)}</button></div>`).join('')}
      <button class="btn" id="b_cadd">${svg('plus', 12)} Add condition</button>
      <div class="row2"><label>Class<select id="b_cls"><option value="">All</option>${['RM', 'WIP', 'FG'].map(x => `<option ${b.filters.item_class === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
        <label>Site<select id="b_site"><option value="">All</option>${S.meta.sites.map(s => `<option ${b.filters.site === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label></div>
      <div class="row2"><label>Sort by<select id="b_sort">${opt(cols, b.sort.col, 'Default')}</select></label><label>Order<select id="b_dir"><option value="desc">High → low</option><option value="asc" ${b.sort.dir === 'asc' ? 'selected' : ''}>Low → high</option></select></label></div>
      <label>Max rows<input id="b_lim" type="number" min="1" value="${esc(b.limit)}" placeholder="All"></label>
      <div class="bbtns"><button class="btn primary" id="b_run">${svg('play', 14)} Run</button><button class="btn" id="b_xl">${svg('download', 14)} Excel</button><button class="btn" id="b_save">${svg('star', 14)} Save as report</button></div>
      <div id="b_msg" class="muted"></div>
    </div><div id="b_out"><div class="empty">${svg('sliders', 28)}<div>Configure the report and press Run.</div></div></div></div>`;
  const read = () => {
    b.dataset = b_ds.value;
    if (b.mode === 'list') b.columns = [...document.querySelectorAll('.colpick input:checked')].map(x => x.value);
    else { b.group_by = b_group.value; document.querySelectorAll('.b_mcol').forEach(x => b.metrics[+x.dataset.mi].col = x.value); document.querySelectorAll('.b_magg').forEach(x => b.metrics[+x.dataset.mi].agg = x.value); }
    document.querySelectorAll('.b_ccol').forEach(x => b.conditions[+x.dataset.ci].col = x.value);
    document.querySelectorAll('.b_cop').forEach(x => b.conditions[+x.dataset.ci].op = x.value);
    document.querySelectorAll('.b_cval').forEach(x => b.conditions[+x.dataset.ci].value = x.value);
    b.filters = { item_class: b_cls.value, site: b_site.value }; b.sort = { col: b_sort.value, dir: b_dir.value }; b.limit = b_lim.value;
  };
  const spec = () => ({ dataset: b.dataset, columns: b.mode === 'list' ? b.columns : [], group_by: b.mode === 'group' ? b.group_by : '',
    metrics: b.mode === 'group' ? b.metrics.filter(x => x.col) : [], conditions: b.conditions.filter(x => x.col && x.value !== ''), filters: b.filters, sort: b.sort, limit: b.limit || null, title: D[b.dataset].label });
  b_ds.onchange = () => { read(); b.columns = []; b.group_by = ''; b.metrics = [{ col: '', agg: 'sum' }]; b.conditions = []; b.sort = { col: '', dir: 'desc' }; renderBuilder(); };
  document.querySelectorAll('[data-mode]').forEach(x => x.onclick = () => { read(); b.mode = x.dataset.mode; renderBuilder(); });
  const madd = document.getElementById('b_madd'); if (madd) madd.onclick = () => { read(); b.metrics.push({ col: '', agg: 'sum' }); renderBuilder(); };
  document.querySelectorAll('[data-mrm]').forEach(x => x.onclick = () => { read(); b.metrics.splice(+x.dataset.mrm, 1); renderBuilder(); });
  b_cadd.onclick = () => { read(); b.conditions.push({ col: '', op: '=', value: '' }); renderBuilder(); };
  document.querySelectorAll('[data-crm]').forEach(x => x.onclick = () => { read(); b.conditions.splice(+x.dataset.crm, 1); renderBuilder(); });
  const run = async () => {
    read(); if (b.mode === 'group' && !b.group_by) { b_msg.textContent = 'Choose a column to group by.'; return; }
    b_msg.textContent = '';
    const r = await api('/api/reports/custom/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ spec: spec() }) });
    if (r.error) { b_msg.textContent = r.error; return; }
    drawReportBody(document.getElementById('b_out'), { ...r, name: D[b.dataset].label });
  };
  b_run.onclick = run;
  b_xl.onclick = async () => { read(); const res = await fetch('/api/reports/custom/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ spec: spec(), name: D[b.dataset].label }) });
    const a = document.createElement('a'); a.href = URL.createObjectURL(await res.blob()); a.download = D[b.dataset].label.replace(/\W+/g, '_') + '.xlsx'; a.click(); };
  b_save.onclick = async () => { read(); const name = prompt('Name for this report', S.builder.savedName || ''); if (!name) return;
    const r = await api('/api/reports/custom', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, spec: spec() }) });
    S.reportCat = null; b_msg.innerHTML = `${svg('check', 14)} Saved as <a href="#report:custom:${r.id}">${esc(name)}</a> under My reports — you can now export or schedule it.`; };
  if (b.ran) run();
  b.ran = true;
}

  S.reportCat = cat;
  const when = x => x.frequency === 'weekly' ? `Weekly on ${DAYS[x.weekday]}` : x.frequency === 'monthly' ? `Monthly on day ${x.monthday}` : FREQ[x.frequency];
  document.getElementById('content').innerHTML = `<div class="vhead"><div><h1>Schedules & history</h1><p>Reports that run automatically, and every report generated by people, schedules or the agent.</p></div>
      <button class="btn primary" id="newSch">${svg('plus', 14)} New schedule</button></div>
    <div id="newBox"></div>
    <div class="card"><h3>${svg('calendar', 15)} Scheduled reports</h3>${s.reports.length ? `<div class="tablewrap"><table><thead><tr><th>Report</th><th>Filters</th><th>When</th><th>Next run (EAT)</th><th>Last run</th><th>Status</th><th>Owner</th><th></th></tr></thead><tbody>
      ${s.reports.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(Object.entries(x.params || {}).map(([k, v]) => k + '=' + v).join(', ') || '–')}</td><td>${esc(when(x))} ${esc(x.time)}</td>
        <td>${esc((x.enabled ? x.next_run || '' : 'Paused').replace('T', ' ').slice(0, 16))}</td><td>${esc((x.last_run || '–').replace('T', ' ').slice(0, 16))}</td>
        <td>${x.last_status ? `<span class="pill"><span class="dot" style="background:${css(x.last_status === 'ok' ? '--good' : '--critical')}"></span>${esc(x.last_status)}</span>` : '–'}</td><td>${esc(x.created_by || '')}</td>
        <td style="white-space:nowrap"><button class="btn" data-tog="${x.id}" data-en="${x.enabled ? 0 : 1}">${x.enabled ? 'Pause' : 'Resume'}</button> <button class="btn" data-del="${x.id}">${svg('trash', 12)}</button></td></tr>`).join('')}</tbody></table></div>`
      : '<div class="muted">No scheduled reports yet. Open any report and choose <b>Schedule</b>, or use New schedule.</div>'}</div>
    <div class="card tablecard" id="hist"></div>`;
  document.getElementById('newSch').onclick = () => {
